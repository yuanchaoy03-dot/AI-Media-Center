            <!-- Prototype labels are CurrentUser MediaSource instances. All three use WebDAV in P0. -->
            <section class="filter-section" data-od-id="filter-source"><h2 class="filter-section-title">来源</h2><div class="filter-list">
              <label class="option-row"><span></span><input type="checkbox" name="mediaSourceId" value="source-alist" /><span class="option-check"><svg aria-hidden="true"><use href="#ph-check-circle"></use></svg></span></label>
              <label class="option-row"><span></span><input type="checkbox" name="mediaSourceId" value="source-home-nas" /><span class="option-check"><svg aria-hidden="true"><use href="#ph-check-circle"></use></svg></span></label>
              <label class="option-row"><span></span><input type="checkbox" name="mediaSourceId" value="source-nextcloud" /><span class="option-check"><svg aria-hidden="true"><use href="#ph-check-circle"></use></svg></span></label>
            </div></section>
            <div class="filter-footer"><button class="quiet-action" id="clearFilters" type="button">清除筛选</button></div>
          </div>
        </div>
        <div class="toolbar-group">
          <button class="toolbar-button" id="sortButton" type="button" aria-expanded="false" aria-controls="sortPopover" data-od-id="movie-sort-button"><span id="sortButtonLabel">最近添加</span><svg class="control-caret" aria-hidden="true"><use href="#ph-caret-right"></use></svg></button>
          <div class="popover sort-popover" id="sortPopover" data-open="false" role="menu" aria-label="电影排序">
            <button class="sort-option" role="menuitemradio" aria-checked="true" data-sort="added">最近添加<svg aria-hidden="true"><use href="#ph-check-circle"></use></svg></button>
            <button class="sort-option" role="menuitemradio" aria-checked="false" data-sort="title">片名 A–Z<svg aria-hidden="true"><use href="#ph-check-circle"></use></svg></button>
            <button class="sort-option" role="menuitemradio" aria-checked="false" data-sort="year">上映年份<svg aria-hidden="true"><use href="#ph-check-circle"></use></svg></button>
            <button class="sort-option" role="menuitemradio" aria-checked="false" data-sort="watched">最近观看<svg aria-hidden="true"><use href="#ph-check-circle"></use></svg></button>
            <button class="sort-option" role="menuitemradio" aria-checked="false" data-sort="duration">时长<svg aria-hidden="true"><use href="#ph-check-circle"></use></svg></button>
          </div>
        </div>
      </div>

      <section class="movie-grid" id="movieGrid" data-od-id="movie-poster-grid" aria-label="收藏影片"></section>

      <section class="movie-loading" id="movieLoading" aria-label="正在载入电影" hidden></section>
      <section class="movie-loading movie-loading-next" id="movieBatchLoading" data-od-id="movie-batch-loading" aria-label="正在载入更多电影" hidden></section>
      <section class="library-state" id="filteredEmpty" data-od-id="filtered-empty-state" hidden><span class="state-icon"><svg aria-hidden="true"><use href="#ph-funnel"></use></svg></span><strong>没有符合条件的电影</strong><p>尝试调整筛选条件</p><button class="state-action" id="emptyClearFilters" type="button">清除筛选</button></section>
      <section class="library-state" id="libraryEmpty" data-od-id="library-empty-state" hidden><span class="state-icon"><svg aria-hidden="true"><use href="#ph-film-slate"></use></svg></span><strong>还没有电影</strong><p>新账号默认没有公共片库。添加 WebDAV 媒体来源后，影片会出现在这里。</p><button class="state-action" type="button" data-route="sources">添加 WebDAV 来源</button></section>
      <p class="sr-only" id="libraryAnnouncement" aria-live="polite"></p>
    </div>
  </main>

  <div class="context-scrim" id="movieContextScrim" data-open="false" aria-hidden="true"></div>
  <div class="context-menu" id="movieContextMenu" data-open="false" role="menu" aria-label="电影操作" inert>
    <button class="context-action" type="button" role="menuitem" data-menu-action="play"><svg aria-hidden="true"><use href="#ph-play-fill"></use></svg><span>播放</span></button>
    <button class="context-action" type="button" role="menuitem" data-menu-action="detail"><svg aria-hidden="true"><use href="#ph-film-slate"></use></svg><span>查看详情</span></button>
    <button class="context-action" id="favoriteAction" type="button" role="menuitem" data-menu-action="favorite"><svg aria-hidden="true"><use href="#ph-heart"></use></svg><span>收藏</span></button>
    <button class="context-action" id="watchedAction" type="button" role="menuitem" data-menu-action="watched"><svg aria-hidden="true"><use href="#ph-check-circle"></use></svg><span>标记为已看</span></button>
    <div class="context-divider"></div>
    <button class="context-action" type="button" role="menuitem" data-menu-action="versions"><svg aria-hidden="true"><use href="#ph-hard-drives"></use></svg><span>查看媒体版本</span></button>
  </div>

  <div class="search-scrim" id="searchScrim" data-open="false"></div>
  <section class="search-dialog" id="searchDialog" data-open="false" role="dialog" aria-modal="true" aria-label="搜索影片" data-od-id="global-search-dialog">
    <div class="search-field"><label class="sr-only" for="globalSearch">搜索片名、导演或演员</label><svg class="icon" aria-hidden="true"><use href="#ph-magnifying-glass"></use></svg><input class="search-input" id="globalSearch" type="search" autocomplete="off" aria-controls="searchResultList" placeholder="搜索片名、导演或演员" /><button class="search-clear" id="clearSearch" type="button" aria-label="清空搜索关键词" data-od-id="search-clear-button" hidden><svg aria-hidden="true"><use href="#ph-x"></use></svg></button><span class="search-key">ESC</span></div>
    <div class="search-results"><p class="search-caption" id="searchCaption">最近内容</p><div class="search-result-list" id="searchResultList" aria-live="polite">
      <button class="search-result" type="button" data-movie-id="movie-interstellar"></button>
      <button class="search-result" type="button" data-movie-id="movie-dune"></button>
      <button class="search-result" type="button" data-movie-id="movie-blade-runner-2049"></button>
      <button class="search-result" type="button" data-movie-id="movie-arrival"></button>
      <button class="search-result" type="button" data-movie-id="movie-oppenheimer"></button>
      <button class="search-result" type="button" data-movie-id="movie-the-batman"></button>
      <button class="search-result" type="button" data-movie-id="movie-inception"></button>
      <button class="search-result" type="button" data-movie-id="movie-dune-part-two"></button>
      <button class="search-result" type="button" data-movie-id="movie-prisoners"></button>
      <button class="search-result" type="button" data-movie-id="movie-1917"></button>
      <button class="search-result" type="button" data-movie-id="movie-mad-max-fury-road"></button>
    </div><div class="search-empty" id="searchEmpty" hidden><strong>没有找到匹配的影片</strong><span>尝试搜索片名、导演或演员</span></div></div>
  </section>

  <script src="assets/js/personal-cinema-media-source-mock.js"></script>
  <script src="assets/js/personal-cinema-library-mock.js"></script>
  <script src="assets/js/personal-cinema-library-view.js"></script>
</body>
</html>
