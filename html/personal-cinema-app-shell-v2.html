<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Cinema · 主页</title>
  <link rel="prefetch" href="personal-cinema-movie-library.html" as="document" />
  <!-- Movie metadata and imagery sourced from TMDB. This product uses TMDB data but is not endorsed or certified by TMDB. -->
  <style>
:root{
  --bg:#0a0a0b;--surface:#141416;--panel:#1c1c1e;--fg:#f5f5f7;--muted:#a1a1a6;--accent:#73a9b7;--border:#f5f5f7;
  --line:color-mix(in oklch,var(--border) 7%,transparent);--line-strong:color-mix(in oklch,var(--border) 16%,transparent);
  --weak:#6e6e73;--icon-default:#afafb6;--icon-hover:#d7d7dc;--icon-active:#f5f5f7;
  --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Segoe UI',sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Segoe UI',sans-serif;
  --font-mono:'SFMono-Regular',Consolas,monospace;--sidebar:220px;
  --radius-xs:8px;--radius-poster:10px;--radius-nav:10px;--radius-sm:12px;--radius-editorial:14px;--radius-md:16px;--radius-lg:20px;--radius-pill:9999px;--radius-circle:50%;
  --text-primary:rgba(255,255,255,.92);--text-secondary:rgba(255,255,255,.62);--text-tertiary:rgba(255,255,255,.46);
}

/* Foundation */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;overflow:hidden;background:var(--bg);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;min-width:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{color:inherit;cursor:pointer}
img,svg{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}
.icon{width:20px;height:20px;flex:0 0 auto}
.more-button{display:grid;place-items:center}
button:focus-visible,a:focus-visible,.search-input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* App shell and sidebar */
.sidebar{position:fixed;inset:0 auto 0 0;z-index:20;width:var(--sidebar);padding:20px 14px 16px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:11px;min-height:40px;padding:0 9px;color:var(--fg);text-decoration:none;font-size:11px;font-weight:650;letter-spacing:.075em}
.brand-mark{display:grid;place-items:center;width:27px;height:27px;border:0;border-radius:var(--radius-xs);background:var(--fg);color:var(--bg);box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--bg) 14%,transparent)}
.brand-mark svg{width:16px;height:16px}
.sidebar-search{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 11px;border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-sm);background:rgba(28,28,30,.72);color:var(--muted);font-size:13px;text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:background .2s ease-out,color .2s ease-out,border-color .2s ease-out}
.sidebar-search:hover{border-color:rgba(255,255,255,.12);background:rgba(34,34,37,.82);color:var(--fg)}
.sidebar-nav{display:flex;flex:1;min-height:0;flex-direction:column;gap:27px;overflow-y:auto}
.nav-group{display:grid;gap:5px}
.library-group{margin-top:2px}
.nav-label{padding:0 12px 8px;color:var(--weak);font-size:11px;font-weight:600;letter-spacing:.06em}
.sidebar-link{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 11px;border:0;border-radius:var(--radius-nav);background:transparent;color:var(--muted);font-size:13px;font-weight:500;text-align:left;transition:background .2s ease-out,color .2s ease-out}
.sidebar-link:hover{background:color-mix(in oklch,var(--panel) 72%,transparent);color:var(--fg)}
.sidebar-link[aria-current="page"]{background:rgba(255,255,255,.075);color:var(--fg);font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.075),0 4px 14px rgba(0,0,0,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sidebar .icon{fill:currentColor;opacity:1}
.sidebar-link .icon,.sidebar-search .icon,.user-button>.icon{width:17px;height:17px;color:var(--icon-default);opacity:1}
.sidebar-link:hover .icon,.sidebar-search:hover .icon,.user-button:hover>.icon,.user-wrap[data-open="true"] .user-button>.icon{color:var(--icon-hover)}
.sidebar-link[aria-current="page"] .icon{color:var(--icon-active);fill:currentColor;opacity:1;stroke-width:initial}
.sidebar-link .icon-selected{display:none}
.sidebar-link[aria-current="page"] .icon-regular{display:none}
.sidebar-link[aria-current="page"] .icon-selected{display:block}
.sidebar-bottom{display:grid;gap:9px;border-top:1px solid var(--line);padding-top:14px}
.user-wrap{position:relative}
.user-button{display:grid;grid-template-columns:32px minmax(0,1fr) 16px;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 8px;border:0;border-radius:var(--radius-sm);background:transparent;text-align:left;transition:background .2s ease-out}
.user-button:hover{background:var(--panel)}
.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--radius-circle);background:var(--fg);color:var(--bg);font-size:12px;font-weight:700}
.user-copy{display:grid;min-width:0}
.user-copy strong{font-size:13px;font-weight:600}
.user-copy small{color:var(--weak);font-size:11px}
.account-menu{position:absolute;left:0;bottom:calc(100% + 8px);z-index:35;width:190px;padding:7px;border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-md);background:rgba(28,28,30,.76);box-shadow:0 18px 50px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.045);opacity:0;pointer-events:none;transform:translateY(6px);-webkit-backdrop-filter:blur(18px) saturate(115%);backdrop-filter:blur(18px) saturate(115%);transition:.2s ease-out}
.user-wrap[data-open="true"] .account-menu{opacity:1;pointer-events:auto;transform:none}
.menu-action{display:flex;align-items:center;gap:9px;width:100%;min-height:38px;padding:0 10px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--fg);font-size:13px}
.menu-action:hover{background:var(--surface)}

/* Main content */
.app-main{height:100vh;min-height:0;margin-left:var(--sidebar);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}
.app-main::-webkit-scrollbar{display:none;width:0;height:0}
body[data-locked="true"] .app-main{overflow:hidden}
.content{width:100%;padding:36px 40px 76px}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}
.page-title{font:700 clamp(30px,2vw,32px)/1.12 var(--font-display);letter-spacing:-.032em}

/* Section headings and shelves */
.section{margin-top:40px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:14px}
.section-link{display:inline-flex;align-items:center;gap:3px;border:0;background:transparent;padding:0;color:var(--fg);font-size:19px;font-weight:600;letter-spacing:-.018em}
.section-link svg{width:15px;height:15px;color:var(--weak)}
.poster-shelf{display:flex;width:100%;max-width:100%;gap:20px;overflow-x:auto;overflow-y:hidden;padding:3px 2px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.poster-shelf::-webkit-scrollbar{display:none}
.poster-card{flex:0 0 clamp(142px,9.4vw,174px);min-width:0;border:0;background:transparent;padding:0;text-align:left;scroll-snap-align:start}
.poster-card:has(.poster-art button:focus-visible) .poster-art::after{opacity:1}
.poster-detail-hit{position:absolute;inset:0;z-index:3;width:100%;height:100%;padding:0;border:0;border-radius:inherit;background:transparent}
.poster-detail-hit:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.poster-copy{display:grid;gap:2px;padding-top:8px}

/* Artwork controls */
.play-mark,.poster-more-mark{position:absolute;z-index:5;display:grid;place-items:center;width:30px;height:30px;padding:0;border-radius:var(--radius-circle);opacity:0;transform:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:opacity 110ms ease-in,background-color 110ms ease-in,color 110ms ease-in}
.play-mark{left:10px;bottom:12px;border:1px solid rgba(255,255,255,.16);background:rgba(246,246,246,.74);color:#111113;box-shadow:0 5px 16px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.1)}
.play-mark svg{width:13px;height:13px;fill:currentColor;stroke:none}
.poster-more-mark{right:10px;bottom:12px;border:1px solid rgba(255,255,255,.16);background:rgba(246,246,246,.20);color:rgba(245,245,247,.94);box-shadow:0 5px 16px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.1)}
.poster-more-mark svg{width:15px;height:15px;fill:currentColor}
.movie-card:hover .play-mark,.poster-card:hover .play-mark,.poster-card:has(button:focus-visible) .play-mark{background:rgba(245,245,247,.9)}
.movie-card:hover .poster-more-mark,.poster-card:hover .poster-more-mark,.poster-card:has(button:focus-visible) .poster-more-mark{background:rgba(245,245,247,.24)}
.movie-card .poster-more-mark[aria-expanded="true"]{opacity:1;background:rgba(245,245,247,.28)}

/* Continue Watching */
.continue-shell{min-width:0}
#continueSection .continue-poster-art,#continueSection .continue-backdrop-art{overflow:hidden;border-radius:var(--radius-sm);isolation:isolate}
#continueSection .continue-poster-art>img,#continueSection .continue-backdrop-art>img{display:block;width:100%;height:100%;border-radius:inherit;object-fit:cover;opacity:1;filter:none;transform:none;transition:none}
#continueSection .continue-poster-art{width:100%;aspect-ratio:2/3}
#continueSection .continue-poster-art .play-mark{left:12px;bottom:21px}
#continueSection .continue-poster-art .poster-more-mark{right:12px;bottom:21px}
.continue-backdrop-art{display:none;position:relative;min-width:0;aspect-ratio:16/9;background:var(--panel);box-shadow:0 8px 24px color-mix(in oklch,var(--bg) 42%,transparent);transform:none;transition:box-shadow .2s ease-out}
.continue-backdrop-art::before{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity 110ms ease-in}
.continue-backdrop-art::after{content:"";position:absolute;inset:32% 0 0;z-index:2;border-radius:inherit;background:linear-gradient(to bottom,transparent,color-mix(in oklch,var(--bg) 88%,transparent));pointer-events:none}
.continue-backdrop-copy{position:absolute;z-index:3;left:18px;right:64px;bottom:17px;display:grid;gap:3px;pointer-events:none}
.continue-backdrop-title{overflow:hidden;color:var(--fg);font-size:17px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.continue-backdrop-meta{color:color-mix(in oklch,var(--fg) 76%,transparent);font-size:12px}
#continueSection .continue-backdrop-art .play-mark{left:auto;right:14px;bottom:21px}
#continueSection .continue-backdrop-art .poster-more-mark{right:62px;bottom:21px}
.continue-adaptive[data-layout="backdrop"]{display:flex;width:100%;max-width:100%;gap:20px;overflow-x:auto;padding:3px 2px 10px}
.continue-adaptive[data-layout="backdrop"] .continue-item{width:auto;max-width:none;flex:0 0 calc((100% - 40px)/3)}
.continue-adaptive[data-layout="backdrop"] .continue-poster-art,.continue-adaptive[data-layout="backdrop"] .poster-copy{display:none}
.continue-adaptive[data-layout="backdrop"] .continue-backdrop-art{display:block}
.continue-adaptive[data-layout="backdrop"] .continue-item:hover .continue-backdrop-art::before,.continue-adaptive[data-layout="backdrop"] .continue-item:has(.continue-backdrop-art button:focus-visible) .continue-backdrop-art::before{opacity:1}

/* Poster context menu */
.context-menu{position:fixed;z-index:38;width:182px;padding:6px;border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-editorial);background:rgba(28,28,30,.88);box-shadow:0 18px 48px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.045);opacity:0;pointer-events:none;-webkit-backdrop-filter:blur(18px) saturate(115%);backdrop-filter:blur(18px) saturate(115%);transform:translateY(-4px);transition:opacity .16s ease-out,transform .16s ease-out}
.context-menu[data-open="true"]{opacity:1;pointer-events:auto;transform:none}
.context-action{display:flex;align-items:center;gap:9px;width:100%;min-height:35px;padding:0 9px;border:0;border-radius:var(--radius-xs);background:transparent;color:var(--text-primary);font-size:13px;font-weight:450;text-align:left;transition:background 110ms ease-in,color 110ms ease-in}
.context-action svg{flex:0 0 auto;width:16px;height:16px;color:var(--icon-default);fill:currentColor;transition:color 110ms ease-in}
.context-action:hover{background:rgba(255,255,255,.06);color:var(--fg)}
.context-action:hover svg{color:var(--icon-hover)}
.context-divider{height:1px;margin:5px 7px;background:var(--line)}

/* Spotlight search */
.search-scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;-webkit-backdrop-filter:blur(2px) saturate(92%);backdrop-filter:blur(2px) saturate(92%);transition:opacity .2s ease-out}
.search-scrim[data-open="true"]{opacity:1;pointer-events:auto}
.search-dialog{position:fixed;z-index:45;left:50%;top:10vh;display:flex;width:min(760px,calc(100% - 40px));max-height:74vh;overflow:hidden;flex-direction:column;border:1px solid rgba(255,255,255,.11);border-radius:var(--radius-lg);background:rgba(28,28,30,.82);box-shadow:0 32px 90px rgba(0,0,0,.56),inset 0 1px 0 rgba(255,255,255,.055);opacity:0;pointer-events:none;-webkit-backdrop-filter:blur(26px) saturate(120%);backdrop-filter:blur(26px) saturate(120%);transform:translate(-50%,-10px) scale(.992);transition:opacity .2s ease-out,transform .2s ease-out}
.search-dialog[data-open="true"]{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.search-field{display:grid;flex:0 0 auto;grid-template-columns:22px minmax(0,1fr) 30px auto;align-items:center;gap:12px;margin:15px 15px 7px;padding:12px 15px;border:1px solid rgba(255,255,255,.09);border-radius:var(--radius-md);background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.035);transition:border-color .2s ease-out,background .2s ease-out,box-shadow .2s ease-out}
.search-field:focus-within{border-color:rgba(255,255,255,.26);outline:0;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.search-field>svg{width:20px;height:20px;color:var(--icon-default);fill:currentColor;opacity:1}
.search-input{width:100%;border:0;outline:0;background:transparent;color:var(--fg);font-size:17px}
.search-input::placeholder{color:var(--muted)}
.search-input:focus-visible{outline:0}
.search-input::-webkit-search-cancel-button,.search-input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.search-clear{display:grid;place-items:center;width:30px;height:30px;padding:0;border:0;border-radius:var(--radius-circle);background:transparent;color:var(--muted);opacity:1;transition:color .2s ease-out,background .2s ease-out}
.search-clear[hidden]{display:none}
.search-clear:hover,.search-clear:focus-visible{background:rgba(255,255,255,.07);color:var(--fg)}
.search-clear:focus-visible{outline:2px solid rgba(255,255,255,.28);outline-offset:1px}
.search-clear svg{width:17px;height:17px;color:inherit;fill:currentColor}
.search-key{padding:3px 7px;border:1px solid rgba(255,255,255,.11);border-radius:var(--radius-xs);background:rgba(255,255,255,.035);color:var(--weak);font:10px var(--font-mono);letter-spacing:.02em}
.search-results{min-height:0;max-height:calc(74vh - 82px);overflow-y:auto;padding:8px 12px 13px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.search-results::-webkit-scrollbar{width:5px}
.search-results::-webkit-scrollbar-track{background:transparent}
.search-results::-webkit-scrollbar-thumb{border-radius:var(--radius-pill);background:rgba(255,255,255,.16)}
.search-results:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25)}
.search-caption{padding:5px 8px 8px;color:color-mix(in oklch,var(--fg) 66%,transparent);font-size:12px;font-weight:600;letter-spacing:.015em}
.search-result-list{display:grid}
.search-result{display:grid;grid-template-columns:42px minmax(0,1fr) 24px;align-items:center;gap:12px;width:100%;min-height:68px;padding:7px 9px;border:0;border-radius:var(--radius-sm);background:transparent;text-align:left;transition:background .2s ease-out,color .2s ease-out}
.search-result:hover,.search-result:focus-visible,.search-result[data-active="true"]{background:rgba(255,255,255,.055)}
.search-result:focus-visible{outline:1px solid rgba(255,255,255,.2);outline-offset:-1px}
.search-thumb{width:40px;aspect-ratio:2/3;border-radius:var(--radius-xs);object-fit:cover;opacity:1;filter:none;transform:none}
.search-result span:nth-child(2){display:grid}
.search-result strong{color:color-mix(in oklch,var(--fg) 92%,transparent);font-size:14px;font-weight:600;transition:color .2s ease-out}
.search-result:hover strong,.search-result:focus-visible strong,.search-result[data-active="true"] strong{color:var(--fg)}
.search-result small{margin-top:2px;color:var(--muted);font-size:12px}
.search-result-caret{display:grid;place-items:center;color:var(--weak);opacity:.42;transition:color .2s ease-out,opacity .2s ease-out,transform .2s ease-out}
.search-result-caret svg{width:15px;height:15px;fill:currentColor}
.search-result:hover .search-result-caret,.search-result:focus-visible .search-result-caret,.search-result[data-active="true"] .search-result-caret{color:var(--icon-hover);opacity:1;transform:translateX(1px)}
.search-result[hidden],.search-empty[hidden],.search-loading[hidden]{display:none!important}
.search-empty{display:grid;gap:4px;padding:28px 10px 32px;color:var(--muted);font-size:12px;text-align:center}
.search-empty strong{color:var(--fg);font-size:14px;font-weight:600}
.search-empty span{color:var(--muted);font-size:12px}
.search-loading{display:grid;gap:5px;padding:4px 0}
.search-skeleton{height:68px;border-radius:var(--radius-sm);background:linear-gradient(90deg,rgba(255,255,255,.025),rgba(255,255,255,.065),rgba(255,255,255,.025));background-size:200% 100%;animation:search-shimmer 1.25s ease-in-out infinite}
@keyframes search-shimmer{to{background-position:-200% 0}}

/* Responsive layout */
@media(min-width:901px){
  .sidebar{inset:8px auto 8px 8px;border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-lg);background:rgba(20,20,22,.78);box-shadow:0 8px 28px rgba(0,0,0,.16);-webkit-backdrop-filter:blur(16px) saturate(118%);backdrop-filter:blur(16px) saturate(118%)}
  .app-main{margin-left:calc(var(--sidebar) + 16px)}
}
@media(max-width:1180px){
}
@media(max-width:900px){
  html,body{height:auto;overflow:auto;scrollbar-width:none;-ms-overflow-style:none}
  html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
  body[data-locked="true"]{overflow:hidden}
  .sidebar{position:sticky;inset:auto;top:0;width:100%;height:70px;padding:10px 14px;flex-direction:row;align-items:center;gap:8px}
  .brand{padding:0 4px}
  .brand>span:last-child,.nav-label,.library-group,.sidebar-bottom>.sidebar-link,.user-copy{display:none}
  .sidebar-search{width:42px;min-height:42px;padding:0;justify-content:center}
  .sidebar-search span{display:none}
  .sidebar-nav{flex-direction:row;overflow:hidden}
  .nav-group{display:flex;min-width:0;gap:2px}
  .sidebar-link{padding:0 10px;white-space:nowrap}
  .sidebar-bottom{display:block;border:0;padding:0}
  .user-button{grid-template-columns:34px;width:42px;min-height:42px;padding:4px}
  .user-button>.icon{display:none}
  .account-menu{left:auto;right:0;bottom:auto;top:calc(100% + 8px)}
  .app-main{height:auto;min-height:100vh;margin-left:0;overflow:visible}
  .content{padding-top:28px;padding-inline:28px}
  .poster-shelf{gap:16px}
}
@media(max-width:680px){
  .brand{width:40px}
  .brand-mark{flex:0 0 auto}
  .top-group .sidebar-link{font-size:0;padding:0 10px}
  .top-group .sidebar-link .icon{width:20px}
  .content{padding-inline:18px}
  .page-heading{align-items:flex-start;flex-direction:column}
  .poster-card{flex-basis:42vw}
  .section{margin-top:32px}
  .continue-backdrop-art{aspect-ratio:16/9}
  .continue-backdrop-copy{left:15px;right:56px;bottom:14px}
  .search-dialog{top:7vh;width:calc(100% - 24px)}
  .search-results{max-height:calc(74vh - 80px)}
  .search-field{margin:12px 12px 6px}
  .search-key{display:none}
}
@media(hover:none){
  .poster-more-mark{opacity:1}
  .context-action{min-height:44px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}
}
  /* Home shelf layout; poster surfaces remain in the shared Movie Card stylesheet. */
#continueSection{margin-top:0}
.view-all{flex-shrink:0;color:var(--muted);font-size:13px;text-decoration:none;white-space:nowrap}
.view-all:hover{color:var(--fg)}
.movie-shelf>.movie-card{flex:0 0 clamp(180px,12vw,260px);scroll-snap-align:start}
.genre-card{position:relative;flex:0 0 calc((100% - 80px)/5);aspect-ratio:16/9;overflow:hidden;border-radius:var(--radius-sm);color:var(--fg);text-decoration:none;scroll-snap-align:start}

  <script src="assets/js/personal-cinema-library-mock.js"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const searchButton = $('searchButton');
      const searchDialog = $('searchDialog');
      const searchScrim = $('searchScrim');
      const searchInput = $('globalSearch');
      const clearSearch = $('clearSearch');
      const searchCaption = $('searchCaption');
      const searchResultList = $('searchResultList');
      const searchEmpty = $('searchEmpty');
      const searchLoading = $('searchLoading');
      const searchResults = searchResultList.parentElement;
      const accountWrap = $('accountWrap');
      const accountButton = $('accountButton');
      const contextMenu = $('movieContextMenu');
      const contextPlayAction = contextMenu.querySelector('[data-menu-action="play"]');
      const favoriteAction = $('favoriteAction');
      const watchedAction = $('watchedAction');
      const announcement = $('homeAnnouncement');
      let activeMovie = null;
      let activeMoreButton = null;
      let searchActiveIndex = -1;

      const HOME_SHELF_LIMIT = 8;
      const { movies, renderMovieCard, matchesLibraryView, getMovieById } = window.PersonalCinemaLibraryMock;
      // Preview limits are independent of viewport width. Full library views have no limit.
      const newestMovies = [...movies].sort((a, b) => b.added - a.added);
      document.querySelector('#addedSection .movie-shelf').replaceChildren(
        ...newestMovies.slice(0, HOME_SHELF_LIMIT).map(renderMovieCard)
      );
      document.querySelector('#unwatchedSection .movie-shelf').replaceChildren(
        ...newestMovies.filter(movie => matchesLibraryView(movie, 'unwatched'))
          .slice(0, HOME_SHELF_LIMIT).map(renderMovieCard)
      );

      const continueSection = $('continueSection');
      const recentTrack = $('recentTrack');
      const continueCards = [...recentTrack.querySelectorAll('.continue-item')];
      continueCards.forEach(card => {
        const movie = getMovieById(card.dataset.movieId);
        card.dataset.title = movie.title;
        card.dataset.status = movie.status;
        card.dataset.favorite = String(movie.favorite);
        card.querySelectorAll('.poster-title,.continue-backdrop-title').forEach(title => title.textContent = movie.title);
        card.querySelector('.continue-poster-art img').src = movie.poster;
        card.querySelector('.continue-poster-art img').alt = `${movie.title} TMDB 官方电影海报`;
        card.querySelector('.continue-backdrop-art img').src = movie.backdrop;
        card.querySelector('.continue-backdrop-art img').alt = `${movie.title} TMDB 官方电影剧照`;
      });
      // Mock ordinal stands in for last_played_at; newest playback comes first.
      continueCards.sort((a, b) => Number(b.dataset.lastPlayed) - Number(a.dataset.lastPlayed));
      continueCards.forEach(card => recentTrack.append(card));

      function openMovieDetail(card) {
        const movie = getMovieById(card.dataset.movieId);
        window.location.href = window.PersonalCinemaLibraryMock.getMovieDetailHref(movie);
      }

      function closeContextMenu() {
        contextMenu.dataset.open = 'false';
        contextMenu.setAttribute('inert', '');
        activeMoreButton?.setAttribute('aria-expanded', 'false');
        activeMoreButton = null;
        activeMovie = null;
      }

      function openContextMenu(button, card) {
        closeContextMenu();
        activeMovie = card;
        activeMoreButton = button;
        activeMoreButton.setAttribute('aria-expanded', 'true');
        contextPlayAction.querySelector('span').textContent = card.dataset.status === 'watching' ? '继续播放' : '播放';
        favoriteAction.querySelector('span').textContent = card.dataset.favorite === 'true' ? '取消收藏' : '加入收藏';
        watchedAction.querySelector('span').textContent = card.dataset.status === 'watched' ? '标记为未看' : '标记为已看';
        contextMenu.removeAttribute('inert');
        contextMenu.dataset.open = 'true';
        const rect = button.getBoundingClientRect();
        const menuRect = contextMenu.getBoundingClientRect();
        const left = Math.min(window.innerWidth - menuRect.width - 10, Math.max(10, rect.right - menuRect.width));
        let top = rect.bottom + 8;
        if (top + menuRect.height > window.innerHeight - 10) top = rect.top - menuRect.height - 8;
        contextMenu.style.left = `${left}px`;
        contextMenu.style.top = `${Math.max(10, top)}px`;
      }

      [...continueCards, ...document.querySelectorAll('.movie-shelf .movie-card')].forEach(card => {
        const title = card.dataset.title;
        card.dataset.status ||= 'watching';
        card.dataset.favorite ||= 'false';
        card.querySelectorAll('.poster-art,.continue-backdrop-art').forEach(art => {
          const detailHit = art.querySelector('.poster-detail-hit') || document.createElement('button');
          detailHit.className = 'poster-detail-hit';
          detailHit.type = 'button';
          detailHit.setAttribute('aria-label', `查看《${title}》详情`);
          detailHit.addEventListener('click', () => {
            openMovieDetail(card);
          });
          art.append(detailHit);

          const playButton = art.querySelector('.play-mark');
          playButton.setAttribute('aria-label', `${card.dataset.status === 'watching' ? '继续播放' : '播放'}《${title}》`);
          playButton.addEventListener('click', event => {
            event.stopPropagation();
            announcement.textContent = `${card.dataset.status === 'watching' ? '继续播放' : '播放'}《${title}》`;
          });

          const moreButton = art.querySelector('.poster-more-mark') || document.createElement('button');
          moreButton.className = 'poster-more-mark';
          moreButton.type = 'button';
          moreButton.setAttribute('aria-label', `${title}更多操作`);
          moreButton.setAttribute('aria-haspopup', 'menu');
          moreButton.setAttribute('aria-expanded', 'false');
          moreButton.setAttribute('aria-controls', 'movieContextMenu');
          moreButton.innerHTML = '<svg aria-hidden="true"><use href="#ph-dots-three-bold"></use></svg>';
          moreButton.addEventListener('click', event => {
            event.stopPropagation();
            openContextMenu(event.currentTarget, card);
          });
          art.append(moreButton);
        });
      });

      contextMenu.addEventListener('click', event => {
        const action = event.target.closest('[data-menu-action]');
        if (!action || !activeMovie) return;
        const title = activeMovie.dataset.title;
        if (action.dataset.menuAction === 'favorite') {
          activeMovie.dataset.favorite = String(activeMovie.dataset.favorite !== 'true');
          announcement.textContent = `${title}${activeMovie.dataset.favorite === 'true' ? '已加入收藏' : '已取消收藏'}`;
        } else if (action.dataset.menuAction === 'watched') {
          activeMovie.dataset.status = activeMovie.dataset.status === 'watched' ? 'unwatched' : 'watched';
          document.querySelectorAll('.movie-card,.continue-item').forEach(card => {
            if (card.dataset.movieId !== activeMovie.dataset.movieId) return;
            card.dataset.status = activeMovie.dataset.status;
            if (card.closest('#unwatchedSection')) card.hidden = !matchesLibraryView(card.dataset, 'unwatched');
            const state = card.querySelector('.continue-backdrop-meta');
            if (state) state.textContent = card.dataset.status === 'watched' ? '已看完 · 可重新播放' : '可重新播放';
            const progress = card.querySelector('.watch-progress');
            if (progress) progress.hidden = true;
          });
          announcement.textContent = `${title}${activeMovie.dataset.status === 'watched' ? '已标记为已看' : '已标记为未看'}`;
        } else if (action.dataset.menuAction === 'play') {
          announcement.textContent = `${activeMovie.dataset.status === "watching" ? "继续播放" : "播放"}《${title}》`;
        } else if (action.dataset.menuAction === 'detail') {
          openMovieDetail(activeMovie);
        } else {
          announcement.textContent = `查看《${title}》的媒体版本`;
        }
        closeContextMenu();
      });

      function renderContinueCount(value) {
        const count = Math.max(0, Math.min(continueCards.length, Number(value) || 0));
        continueSection.hidden = count === 0;
        continueCards.forEach((card, index) => card.hidden = index >= count);

        const layout = 'backdrop';
        recentTrack.dataset.layout = layout;
        recentTrack.dataset.count = String(count);
        recentTrack.tabIndex = 0;
        recentTrack.setAttribute('aria-label', '最近观看横向剧照');
      }

      renderContinueCount(continueCards.length);
      window.setContinueWatchingCount = renderContinueCount;

      const searchResultItems = [...searchResultList.querySelectorAll('.search-result')];
      const visibleSearchItems = () => searchResultItems.filter(item => !item.hidden);

      function setSearchActive(index) {
        const items = visibleSearchItems();
        searchActiveIndex = items.length
          ? Math.max(0, Math.min(index, items.length - 1))
          : -1;
        searchResultItems.forEach(item => item.removeAttribute('data-active'));
        if (searchActiveIndex < 0) return;

        const item = items[searchActiveIndex];
        item.dataset.active = 'true';
        const top = item.offsetTop;
        const bottom = top + item.offsetHeight;
        if (top < searchResults.scrollTop) searchResults.scrollTop = top;
        if (bottom > searchResults.scrollTop + searchResults.clientHeight) {
          searchResults.scrollTop = bottom - searchResults.clientHeight;
        }
      }

      function renderSearch(query = '') {
        const q = query.trim().toLowerCase();
        let visible = 0;
        clearSearch.hidden = !searchInput.value;
        searchCaption.textContent = q ? '搜索结果' : '最近内容';
        searchLoading.hidden = true;

        searchResultItems.forEach((item, index) => {
          const match = q ? item.dataset.search.toLowerCase().includes(q) : index < 5;
          item.hidden = !match;
          if (match) visible += 1;
        });

        searchEmpty.hidden = visible > 0;
        searchResults.scrollTop = 0;
        searchActiveIndex = -1;
        searchResultItems.forEach(item => item.removeAttribute('data-active'));
      }

      function openSearch() {
        closeContextMenu();
        renderSearch(searchInput.value);
        searchDialog.dataset.open = 'true';
        searchScrim.dataset.open = 'true';
        searchButton.setAttribute('aria-expanded', 'true');
        document.body.dataset.locked = 'true';
        setTimeout(() => searchInput.focus(), 0);
      }

      function closeSearch() {
        searchDialog.dataset.open = 'false';
        searchScrim.dataset.open = 'false';
        searchButton.setAttribute('aria-expanded', 'false');
        document.body.dataset.locked = 'false';
        searchActiveIndex = -1;
        searchResultItems.forEach(item => item.removeAttribute('data-active'));
      }

      function setSearchLoading(loading) {
        searchLoading.hidden = !loading;
        searchCaption.textContent = loading ? '正在搜索' : '最近内容';
        searchResultItems.forEach(item => item.hidden = loading);
        searchEmpty.hidden = true;
        if (!loading) renderSearch(searchInput.value);
      }

      window.setSearchLoading = setSearchLoading;

      searchButton.addEventListener('click', openSearch);
      searchScrim.addEventListener('click', closeSearch);
      searchInput.addEventListener('input', () => renderSearch(searchInput.value));
      clearSearch.addEventListener('click', () => {
        searchInput.value = '';
        renderSearch();
        searchInput.focus();
      });
      searchInput.addEventListener('keydown', event => {
        if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp' && event.key !== 'Enter') return;

        const items = visibleSearchItems();
        if (!items.length) return;
        if (event.key === 'Enter') {
          if (searchActiveIndex >= 0) {
            event.preventDefault();
            items[searchActiveIndex].click();
          }
          return;
        }

        event.preventDefault();
        const next = event.key === 'ArrowDown'
          ? (searchActiveIndex + 1) % items.length
          : searchActiveIndex <= 0
            ? items.length - 1
            : searchActiveIndex - 1;
        setSearchActive(next);
      });
      searchResultItems.forEach(item => item.addEventListener('click', () => { closeSearch(); window.location.href = window.PersonalCinemaLibraryMock.getMovieDetailHref(item.dataset.movieId); }));

      accountButton.addEventListener('click', () => {
        const open = accountWrap.dataset.open !== 'true';
        accountWrap.dataset.open = String(open);
        accountButton.setAttribute('aria-expanded', String(open));
      });

      const sidebarRoutes = [
        ...document.querySelectorAll('.sidebar-nav .sidebar-link[data-route]')
      ];
      const routes = {
        recent: 'personal-cinema-recently-added.html', favorites: 'personal-cinema-favorites.html', unwatched: 'personal-cinema-unwatched.html', watched: 'personal-cinema-watched.html',
        home: 'personal-cinema-app-shell-v2.html',
        movies: 'personal-cinema-movie-library.html',
        ai: 'personal-cinema-ai-discovery.html',
        sources: 'personal-cinema-media-sources.html'
      };
      document.querySelectorAll('[data-route]').forEach(button => {
        button.addEventListener('click', () => {
          const target = routes[button.dataset.route];
          if (target) {
            window.location.href = target;
            return;
          }
          if (!button.matches('.sidebar-nav .sidebar-link')) return;
          sidebarRoutes.forEach(item => item.removeAttribute('aria-current'));
          button.setAttribute('aria-current', 'page');
        });
      });

      document.querySelectorAll('[data-action]').forEach(button => {
        button.addEventListener('click', () => {
          accountWrap.dataset.open = 'false';
          accountButton.setAttribute('aria-expanded', 'false');
        });
      });

      function enableWheelHorizontalScroll(shelf) {
        let wheelOwnsScroll = false;
        const originalSnap = shelf.style.scrollSnapType;
        function restoreNativeSnap() {
          if (!wheelOwnsScroll) return;
          shelf.style.scrollSnapType = originalSnap;
          wheelOwnsScroll = false;
        }
        shelf.addEventListener('pointerleave', restoreNativeSnap);
        shelf.addEventListener('touchstart', restoreNativeSnap, { passive: true });
        shelf.addEventListener('keydown', restoreNativeSnap);
        shelf.addEventListener('wheel', event => {
          // Leave zoom and native horizontal/Shift gestures to the browser.
          if (event.defaultPrevented || !event.cancelable) return;
          if (event.ctrlKey || event.shiftKey) {
            restoreNativeSnap();
            return;
          }
          if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) {
            restoreNativeSnap();
            return;
          }

          const maxScrollLeft = Math.max(0, shelf.scrollWidth - shelf.clientWidth);
          const position = shelf.scrollLeft;
          if (maxScrollLeft <= 2) return;
          if (event.deltaY < 0 ? position <= 2 : position >= maxScrollLeft - 2) return;

          // Wheel units are pixels by default; normalize line/page input locally.
          const unit = event.deltaMode === WheelEvent.DOM_DELTA_LINE ? 16
            : event.deltaMode === WheelEvent.DOM_DELTA_PAGE ? shelf.clientWidth : 1;
          event.preventDefault();
          // Programmatic steps otherwise snap back or jump a whole card in Chromium.
          // Suspend only while the pointer uses mapped wheel input; native gestures retain proximity snap.
          if (!wheelOwnsScroll) {
            shelf.style.scrollSnapType = 'none';
            wheelOwnsScroll = true;
          }
          shelf.scrollLeft = Math.max(0, Math.min(maxScrollLeft, position + event.deltaY * unit));
        }, { passive: false });
      }
      document.querySelectorAll('#recentTrack, #genreSection .poster-shelf, #addedSection .poster-shelf, #unwatchedSection .poster-shelf')
        .forEach(enableWheelHorizontalScroll);
      window.addEventListener('resize', closeContextMenu);

      document.addEventListener('click', event => {
        if (!contextMenu.contains(event.target) && event.target !== activeMoreButton) closeContextMenu();
        if (!accountWrap.contains(event.target)) {
          accountWrap.dataset.open = 'false';
          accountButton.setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('keydown', event => {
        if (event.key === '/' && document.activeElement !== searchInput) {
          event.preventDefault();
          openSearch();
        }
        if (event.key === 'Escape') {
          closeContextMenu();
          closeSearch();
          accountWrap.dataset.open = 'false';
          accountButton.setAttribute('aria-expanded', 'false');
        }
      });
    })();
  </script>
</body>
</html>
