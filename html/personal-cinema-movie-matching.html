  <div class="dialog-scrim" id="matchingDialogScrim" data-open="false">
    <section class="matching-dialog" id="matchingDialog" role="dialog" aria-modal="true" aria-labelledby="matchingDialogTitle" inert>
      <header class="dialog-header">
        <div class="dialog-heading"><h2 id="matchingDialogTitle">确认影片匹配</h2><p id="dialogFilename"></p></div>
        <button class="dialog-icon-button" id="matchingDialogClose" type="button" aria-label="关闭影片匹配"><svg aria-hidden="true"><use href="#ph-x"></use></svg></button>
      </header>
      <div class="dialog-scroll">
        <div class="detail-layout">
          <div class="detail-column">
            <section class="detail-card surface-card" aria-labelledby="originalFileTitle">
              <h3 id="originalFileTitle">原始文件</h3>
              <dl class="fact-list">
                <div class="fact-row"><dt>文件</dt><dd class="file-value" id="detailFile"></dd></div>
                <div class="fact-row"><dt>来源</dt><dd>家庭 NAS · WebDAV</dd></div>
                <div class="fact-row"><dt>路径</dt><dd class="file-value" id="detailPath"></dd></div>
                <div class="fact-row"><dt>标题</dt><dd id="detailParsedTitle"></dd></div>
                <div class="fact-row"><dt>年份</dt><dd id="detailYear"></dd></div>
                <div class="fact-row" id="detailEditionRow"><dt>Edition</dt><dd id="detailEdition"></dd></div>
                <div class="fact-row"><dt>清晰度</dt><dd id="detailQuality"></dd></div>
              </dl>
            </section>
            <section class="detail-card surface-card" aria-labelledby="likelyMatchTitle">
              <h3 id="likelyMatchTitle">系统最可能匹配</h3>
              <div class="likely-match"><span class="poster-frame likely-poster" id="likelyPoster" data-fallback="MOVIE"></span><div class="likely-copy"><strong id="likelyTitle"></strong><span id="likelyOriginal"></span><span id="likelyMeta"></span><span class="status-label" id="likelyConfidence" data-state="pending"></span><div class="match-reasons" id="matchReasons"></div></div></div>
            </section>
          </div>

          <div class="detail-column">
            <section class="candidate-section" aria-labelledby="candidateTitle">
              <div class="candidate-toolbar"><h3 id="candidateTitle">TMDB 候选</h3><button class="search-again-button" id="searchAgainButton" type="button">重新搜索</button></div>
              <form class="candidate-search" id="candidateSearch" hidden><label class="sr-only" for="candidateQuery">搜索 TMDB 候选</label><input id="candidateQuery" type="search" autocomplete="off" placeholder="输入片名或年份" /><button class="secondary-action" id="candidateSearchSubmit" type="submit">搜索</button></form>
              <p class="candidate-feedback" id="candidateFeedback" aria-live="polite">按解析标题和年份返回的候选</p>
              <div class="candidate-list" id="candidateList"></div>
            </section>
          </div>
        </div>
      </div>
      <footer class="dialog-actions">
        <div class="dialog-actions-secondary"><button class="quiet-action" id="notMovieButton" type="button">标记为非电影</button><button class="quiet-action" id="laterButton" type="button">稍后处理</button></div>
        <div class="dialog-actions-primary"><button class="primary-action" id="confirmMatchButton" type="button">确认匹配</button></div>
      </footer>
    </section>
