<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>媒体来源 · Personal Cinema</title>
  <style>
    :root{
      --bg:#0a0a0b;--surface:#141416;--panel:#1c1c1e;--fg:#f5f5f7;--muted:#a1a1a6;--accent:#73a9b7;
      --border:#f5f5f7;--line:color-mix(in oklch,var(--border) 7%,transparent);--line-strong:color-mix(in oklch,var(--border) 13%,transparent);
      --weak:#6e6e73;--icon-default:#afafb6;--icon-hover:#d7d7dc;--icon-active:#f5f5f7;
      --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Segoe UI',sans-serif;
      --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Segoe UI',sans-serif;
      --font-mono:'SFMono-Regular',Consolas,monospace;--sidebar:220px;
      --radius-xs:8px;--radius-poster:10px;--radius-nav:10px;--radius-sm:12px;--radius-editorial:14px;
      --radius-md:16px;--radius-lg:20px;--radius-pill:9999px;--radius-circle:50%;
      --text-primary:rgba(255,255,255,.92);--text-secondary:rgba(255,255,255,.62);--text-tertiary:rgba(255,255,255,.46);
    }
    *,*::before,*::after{box-sizing:border-box}
    html{height:100%;overflow:hidden;background:var(--bg);-webkit-text-size-adjust:100%}
    body{height:100%;margin:0;min-width:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}img,svg{display:block;max-width:100%}h1,h2,h3,p{margin:0}[hidden]{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}.icon{width:20px;height:20px;flex:0 0 auto}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    .app-shell{display:contents}
    .sidebar{position:fixed;inset:0 auto 0 0;z-index:20;width:var(--sidebar);padding:20px 14px 16px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:20px}
    .brand{display:flex;align-items:center;gap:11px;min-height:40px;padding:0 9px;color:var(--fg);text-decoration:none;font-size:11px;font-weight:650;letter-spacing:.075em}
    .brand-mark{display:grid;place-items:center;width:27px;height:27px;border:0;border-radius:var(--radius-xs);background:var(--fg);color:var(--bg);box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--bg) 14%,transparent)}.brand-mark svg{width:16px;height:16px}
    .sidebar-search{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 11px;border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-sm);background:rgba(28,28,30,.72);color:var(--muted);font-size:13px;text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:background .2s ease-out,color .2s ease-out,border-color .2s ease-out}
    .sidebar-search:hover{border-color:rgba(255,255,255,.12);background:rgba(34,34,37,.82);color:var(--fg)}
    .sidebar-nav{display:flex;flex:1;min-height:0;flex-direction:column;gap:27px;overflow-y:auto}.nav-group{display:grid;gap:5px}.library-group{margin-top:2px}.nav-label{padding:0 12px 8px;color:var(--weak);font-size:11px;font-weight:600;letter-spacing:.06em}
    .sidebar-link{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 11px;border:0;border-radius:var(--radius-nav);background:transparent;color:var(--muted);font-size:13px;font-weight:500;text-align:left;transition:background .2s ease-out,color .2s ease-out}.sidebar-link:hover{background:color-mix(in oklch,var(--panel) 72%,transparent);color:var(--fg)}
    .sidebar-link[aria-current="page"]{background:rgba(255,255,255,.075);color:var(--fg);font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.075),0 4px 14px rgba(0,0,0,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
    .sidebar .icon{fill:currentColor;opacity:1}.sidebar-link .icon,.sidebar-search .icon,.user-button>.icon{width:17px;height:17px;color:var(--icon-default);opacity:1}.sidebar-link:hover .icon,.sidebar-search:hover .icon,.user-button:hover>.icon,.user-wrap[data-open="true"] .user-button>.icon{color:var(--icon-hover)}.sidebar-link[aria-current="page"] .icon{color:var(--icon-active)}.sidebar-link .icon-selected{display:none}.sidebar-link[aria-current="page"] .icon-regular{display:none}.sidebar-link[aria-current="page"] .icon-selected{display:block}
    .sidebar-bottom{display:grid;gap:9px;border-top:1px solid var(--line);padding-top:14px}.user-wrap{position:relative}.user-button{display:grid;grid-template-columns:32px minmax(0,1fr) 16px;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 8px;border:0;border-radius:var(--radius-sm);background:transparent;text-align:left;transition:background .2s ease-out}.user-button:hover{background:var(--panel)}
    .avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--radius-circle);background:var(--fg);color:var(--bg);font-size:12px;font-weight:700}.user-copy{display:grid;min-width:0}.user-copy strong{font-size:13px;font-weight:600}.user-copy small{color:var(--weak);font-size:11px}
    .account-menu{position:absolute;left:0;bottom:calc(100% + 8px);z-index:35;width:190px;padding:7px;border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-md);background:rgba(28,28,30,.76);box-shadow:0 18px 50px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.045);opacity:0;pointer-events:none;transform:translateY(6px);-webkit-backdrop-filter:blur(18px) saturate(115%);backdrop-filter:blur(18px) saturate(115%);transition:.2s ease-out}.user-wrap[data-open="true"] .account-menu{opacity:1;pointer-events:auto;transform:none}.menu-action{display:flex;align-items:center;gap:9px;width:100%;min-height:38px;padding:0 10px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--fg);font-size:13px}.menu-action:hover{background:var(--surface)}

    .app-main{height:100vh;min-height:0;margin-left:var(--sidebar);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}.app-main::-webkit-scrollbar{display:none;width:0;height:0}body[data-locked="true"] .app-main{overflow:hidden}
    .content{width:100%;padding:36px clamp(32px,3vw,64px) 76px}
    .content-inner{width:min(100%,1600px);margin-inline:auto}
    .page-heading{display:flex;align-items:center;justify-content:space-between;gap:24px;width:100%;max-width:none;margin-bottom:38px}
    .page-title{margin:0;color:var(--text-primary);font-family:var(--font-display);font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.025em}
    .add-source-button,.empty-action{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 15px;border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-nav);background:var(--fg);color:var(--bg);font-size:13px;font-weight:650;cursor:pointer;transition:background .18s,transform .18s}
    .add-source-button:hover,.empty-action:hover{background:#d7d7dc}
    .add-source-button:active,.empty-action:active{transform:scale(.98)}
    .add-source-button svg{width:16px;height:16px}
    .add-source-button svg,
    .source-icon svg,
    .source-status svg,
    .source-more svg,
    .empty-icon svg,
    .scan-icon svg,
    .scan-chevron,
    .source-menu button svg,
    .dialog-icon-button svg,
    .type-icon svg,
    .type-chevron{fill:currentColor}
    .sources-workspace{width:100%;max-width:none}
    .sources-section + .sources-section{margin-top:46px}
    .section-title{margin:0 0 15px;color:var(--text-primary);font-family:var(--font-display);font-size:18px;line-height:1.3;font-weight:650}

    .source-list{display:grid;grid-template-columns:1fr;gap:12px}
    .source-item{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto 36px;grid-template-rows:auto auto;align-items:center;gap:8px 14px;min-height:112px;padding:16px;border:1px solid var(--line);border-radius:var(--radius-md);background:rgba(255,255,255,.025);transition:background .18s,border-color .18s}
    .source-item:hover{background:rgba(255,255,255,.045);border-color:var(--line-strong)}
    .source-hit{position:absolute;inset:0;z-index:1;border:0;border-radius:inherit;background:transparent;cursor:pointer}
    .source-hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .source-icon,.source-copy,.source-status,.source-footer,.source-more{position:relative;z-index:2;pointer-events:none}
    .source-icon{grid-column:1;grid-row:1/3;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:var(--radius-sm);background:rgba(255,255,255,.045);color:var(--icon-default)}
    .source-icon svg{width:22px;height:22px}
    .source-copy{grid-column:2;grid-row:1;display:grid;gap:3px;min-width:0}
    .source-name{overflow:hidden;color:var(--text-primary);font-size:16px;line-height:1.25;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
    .source-type,.source-location,.source-count,.source-last-scan{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .source-type{color:var(--text-secondary);font-size:13px;line-height:1.35}
    .source-location{color:var(--text-tertiary);font-size:12px;line-height:1.35}
    .source-footer{grid-column:2/5;grid-row:2;display:flex;align-items:center;gap:7px;min-width:0;color:var(--text-tertiary);font-size:12px;line-height:1.35}
    .source-footer .meta-divider{color:var(--weak)}
    .source-status{grid-column:3;grid-row:1;display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:12px;white-space:nowrap}
    .source-status svg{width:16px;height:16px;color:var(--accent)}
    .source-more{grid-column:4;grid-row:1;display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:var(--radius-xs);background:transparent;color:var(--icon-default);cursor:pointer;pointer-events:auto;transition:background .18s,color .18s}
    .source-more:hover{background:rgba(255,255,255,.075);color:var(--fg)}
    .source-more svg{width:18px;height:18px}
    .spinner{display:inline-block;width:14px;height:14px;border:1.5px solid rgba(255,255,255,.22);border-top-color:var(--accent);border-radius:50%;animation:spin .72s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .source-empty{display:grid;justify-items:center;padding:56px 24px;border:1px dashed var(--line-strong);border-radius:var(--radius-md);text-align:center}
    .empty-icon{display:grid;place-items:center;width:52px;height:52px;margin-bottom:17px;border:1px solid var(--line);border-radius:var(--radius-md);background:rgba(255,255,255,.035);color:var(--icon-default)}
    .empty-icon svg{width:25px;height:25px}.source-empty h3{margin:0;color:var(--text-primary);font-size:17px}.source-empty p{max-width:360px;margin:9px 0 20px;color:var(--text-secondary);font-size:13px;line-height:1.65}
    .empty-action{height:38px;font-size:12px}

    .scan-list{border-top:1px solid var(--line)}
    .scan-item{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr) auto 18px;align-items:center;gap:12px;min-height:64px;padding:10px 4px;border-bottom:1px solid var(--line)}
    .scan-item:last-child{border-bottom:0}
    .scan-hit{position:absolute;inset:0;border:0;background:transparent;cursor:pointer}
    .scan-item:hover{background:transparent}
    .scan-icon,.scan-copy,.scan-time,.scan-chevron{position:relative;z-index:1;pointer-events:none}
    .scan-icon{display:grid;place-items:center;width:24px;height:24px;color:var(--accent)}.scan-icon svg{width:17px;height:17px}
    .scan-copy{min-width:0}.scan-copy strong,.scan-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scan-copy strong{color:var(--text-primary);font-size:13px;font-weight:600;transition:color .16s ease-out}.scan-item:hover .scan-copy strong{color:var(--fg)}.scan-copy span{margin-top:4px;color:var(--text-secondary);font-size:12px}
    .scan-time{color:var(--text-tertiary);font-size:12px;white-space:nowrap}.scan-chevron{width:16px;height:16px;color:var(--weak);transition:color .16s ease-out}.scan-item:hover .scan-chevron{color:var(--icon-hover)}

    .section-heading-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:15px}
    .section-heading-row .section-title{margin-bottom:0}
    .section-action{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0;border:0;background:transparent;color:var(--text-tertiary);font-size:12px;text-decoration:none;transition:color .16s ease-out}
    .section-action:hover{color:var(--text-primary)}
    .section-action svg{width:14px;height:14px;fill:currentColor}
    .recent-media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
    .recent-media-item{display:block;min-width:0;color:inherit;text-decoration:none}
    .recent-poster{display:block;position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;border-radius:var(--radius-poster);background:var(--panel);box-shadow:0 8px 22px color-mix(in oklch,var(--bg) 46%,transparent)}
    .recent-poster img{display:block;width:100%;height:100%;border-radius:inherit;object-fit:cover}
    .recent-poster::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;transition:opacity 110ms ease-in}
    .recent-media-item:hover .recent-poster::after{opacity:1}
    .recent-media-copy{display:grid;grid-template-rows:16px 15px;gap:2px;height:41px;padding-top:8px}
    .recent-media-title,.recent-media-source{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .recent-media-title{color:var(--text-primary);font-size:13px;font-weight:500;line-height:16px}
    .recent-media-source{color:var(--text-tertiary);font-size:12px;font-weight:400;line-height:15px}

    .source-menu-scrim{position:fixed;inset:0;z-index:58;background:transparent;opacity:0;visibility:hidden}.source-menu-scrim[data-open="true"]{opacity:1;visibility:visible}
    .source-menu{position:fixed;z-index:60;width:176px;padding:6px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:rgba(28,28,30,.96);box-shadow:0 20px 52px rgba(0,0,0,.45);opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .15s,transform .15s,visibility .15s}
    .source-menu[data-open="true"]{opacity:1;visibility:visible;transform:none}
    .source-menu-handle{display:none}
    .source-menu button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border:0;border-radius:var(--radius-xs);background:transparent;color:var(--text-secondary);cursor:pointer;text-align:left}
    .source-menu button:hover{background:rgba(255,255,255,.075);color:var(--fg)}.source-menu button svg{width:16px;height:16px}.source-menu button span{font-size:12px}
    .source-menu .menu-divider{height:1px;margin:5px 4px;background:var(--line)}.source-menu .remove-source{color:var(--text-tertiary)}.source-menu .remove-source:hover{color:var(--fg)}

    .dialog-scrim{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:22px;background:rgba(0,0,0,.62);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
    .dialog-scrim[data-open="true"]{opacity:1;visibility:visible}
    .source-dialog{width:min(560px,100%);max-height:min(760px,calc(100dvh - 44px));overflow:auto;border:1px solid var(--line-strong);border-radius:var(--radius-lg);background:rgba(28,28,30,.88);box-shadow:0 32px 80px rgba(0,0,0,.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transform:translateY(12px) scale(.985);transition:transform .2s}
    .dialog-scrim[data-open="true"] .source-dialog{transform:none}
    .dialog-header{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:8px;padding:18px 18px 12px}
    .dialog-header h2{margin:0;color:var(--text-primary);font-family:var(--font-display);font-size:20px;line-height:1.25;font-weight:650;text-align:center}
    .dialog-icon-button{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:var(--radius-xs);background:transparent;color:var(--icon-default);cursor:pointer}.dialog-icon-button:hover{background:rgba(255,255,255,.07);color:var(--fg)}.dialog-icon-button svg{width:18px;height:18px}
    .dialog-body{padding:10px 22px 24px}.dialog-kicker{margin:0 0 12px;color:var(--text-secondary);font-size:13px;font-weight:600}
    .source-type-list{display:grid;gap:10px}.source-type-option{display:grid;grid-template-columns:42px minmax(0,1fr) 18px;align-items:center;gap:13px;min-height:74px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:rgba(255,255,255,.025);color:var(--fg);cursor:pointer;text-align:left;transition:background .18s,border-color .18s}.source-type-option:hover{background:rgba(255,255,255,.05);border-color:var(--line-strong)}
    .type-icon{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:var(--radius-nav);background:rgba(255,255,255,.04);color:var(--icon-default)}.type-icon svg{width:21px;height:21px}.type-copy{min-width:0}.type-copy strong,.type-copy span{display:block}.type-copy strong{color:var(--text-primary);font-size:14px;font-weight:600}.type-copy span{margin-top:4px;color:var(--text-secondary);font-size:12px;line-height:1.45}.type-chevron{width:16px;height:16px;color:var(--weak)}
    .form-grid{display:grid;gap:14px}.form-field{display:grid;gap:7px}.form-field label{color:var(--text-secondary);font-size:12px;font-weight:600}.form-field input{width:100%;height:42px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--radius-nav);background:rgba(10,10,11,.48);color:var(--fg);font-size:13px;outline:none;transition:border-color .18s,background .18s}.form-field input:hover{background:rgba(10,10,11,.64)}.form-field input:focus{border-color:var(--accent)}.form-field input::placeholder{color:var(--text-tertiary)}
    .form-help{margin:-2px 0 0;color:var(--text-tertiary);font-size:11px;line-height:1.5}.connection-feedback{min-height:20px;margin-top:2px;color:var(--text-secondary);font-size:12px}.connection-feedback[data-success="true"]{color:var(--accent)}
    .dialog-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:18px}.secondary-action,.primary-action{height:40px;padding:0 15px;border-radius:var(--radius-nav);font-size:13px;font-weight:600;cursor:pointer}.secondary-action{border:1px solid var(--line-strong);background:rgba(255,255,255,.035);color:var(--text-primary)}.secondary-action:hover{background:rgba(255,255,255,.065)}.primary-action{border:1px solid rgba(255,255,255,.12);background:var(--fg);color:var(--bg)}.primary-action:hover{background:#d7d7dc}.primary-action:disabled,.secondary-action:disabled{opacity:.42;cursor:not-allowed}

    .search-scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;-webkit-backdrop-filter:blur(2px) saturate(92%);backdrop-filter:blur(2px) saturate(92%);transition:opacity .2s ease-out}.search-scrim[data-open="true"]{opacity:1;pointer-events:auto}
    .search-dialog{position:fixed;z-index:45;left:50%;top:10vh;display:flex;width:min(760px,calc(100% - 40px));max-height:74vh;overflow:hidden;flex-direction:column;border:1px solid rgba(255,255,255,.11);border-radius:var(--radius-lg);background:rgba(28,28,30,.82);box-shadow:0 32px 90px rgba(0,0,0,.56),inset 0 1px 0 rgba(255,255,255,.055);opacity:0;pointer-events:none;-webkit-backdrop-filter:blur(26px) saturate(120%);backdrop-filter:blur(26px) saturate(120%);transform:translate(-50%,-10px) scale(.992);transition:opacity .2s ease-out,transform .2s ease-out}.search-dialog[data-open="true"]{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
    .search-field{display:grid;grid-template-columns:22px minmax(0,1fr) 30px auto;align-items:center;gap:12px;margin:15px 15px 7px;padding:12px 15px;border:1px solid rgba(255,255,255,.09);border-radius:var(--radius-md);background:rgba(255,255,255,.055)}.search-field>svg{width:20px;height:20px;color:var(--icon-default);fill:currentColor}.search-input{width:100%;border:0;outline:0;background:transparent;color:var(--fg);font-size:17px}.search-input::placeholder{color:var(--muted)}.search-input:focus-visible{outline:0}.search-clear{display:grid;place-items:center;width:30px;height:30px;padding:0;border:0;border-radius:var(--radius-circle);background:transparent;color:var(--muted)}.search-clear:hover{background:rgba(255,255,255,.07);color:var(--fg)}.search-clear svg{width:17px;height:17px;fill:currentColor}.search-key{padding:3px 7px;border:1px solid rgba(255,255,255,.11);border-radius:var(--radius-xs);background:rgba(255,255,255,.035);color:var(--weak);font:10px var(--font-mono)}

  <script>
    const sources = [
      {id:'source-home-nas',name:'家庭 NAS',type:'WebDAV',address:'https://nas.example.com/dav',location:'nas.example.com/dav · /Movies',rootPath:'/Movies',movieCount:126,status:'available',lastScan:'8 分钟前',icon:'ph-cloud'},
      {id:'source-alist',name:'AList · 迅雷云盘',type:'WebDAV',address:'https://alist.example.com/dav',location:'alist.example.com/dav · /Movies',rootPath:'/Movies',movieCount:58,status:'available',lastScan:'23 分钟前',icon:'ph-cloud'},
      {id:'source-nextcloud',name:'我的 Nextcloud',type:'WebDAV',address:'https://cloud.example.com/remote.php/dav/files/lin',location:'cloud.example.com · /Cinema',rootPath:'/Cinema',movieCount:84,status:'available',lastScan:'昨天',icon:'ph-cloud'}
    ];

    const scans = [
      {id:'scan_20260903_1032',sourceId:'source-home-nas',name:'家庭 NAS',summary:'扫描完成 · 新增 119 部 · 待确认 3 个 · 跳过 2 个',time:'8 分钟前'},
      {id:'scan-alist',sourceId:'source-alist',name:'AList · 迅雷云盘',summary:'扫描完成 · 没有发现变化',time:'23 分钟前'},
      {id:'scan-nextcloud',sourceId:'source-nextcloud',name:'我的 Nextcloud',summary:'扫描完成 · 新增 1 部',time:'昨天'}
    ];

    const recentMedia = [
      {id:'dune-part-two',title:'沙丘2',sourceName:'家庭 NAS',posterSourceTitle:'沙丘2',href:'personal-cinema-movie-detail-dune-part-two.html'},
      {id:'oppenheimer',title:'奥本海默',sourceName:'我的 Nextcloud',posterSourceTitle:'奥本海默',href:'personal-cinema-movie-detail-oppenheimer.html'},
      {id:'interstellar',title:'星际穿越',sourceName:'家庭 NAS',posterSourceTitle:'星际穿越',href:'personal-cinema-movie-detail-interstellar.html'},
      {id:'dune',title:'沙丘',sourceName:'AList · 迅雷云盘',posterSourceTitle:'沙丘',href:'personal-cinema-movie-detail.html'},
      {id:'arrival',title:'降临',sourceName:'AList · 迅雷云盘',posterSourceTitle:'降临',href:'personal-cinema-movie-library.html'},
      {id:'parasite',title:'寄生虫',sourceName:'我的 Nextcloud',posterSourceTitle:'寄生虫',href:'personal-cinema-movie-library.html'}
    ];

    const sourceList = document.getElementById('sourceList');
    const sourceEmpty = document.getElementById('sourceEmpty');
    const scanList = document.getElementById('scanList');
    const recentMediaGrid = document.getElementById('recentMediaGrid');
    const announcement = document.getElementById('announcement');
    const sourceMenu = document.getElementById('sourceMenu');
    const sourceMenuScrim = document.getElementById('sourceMenuScrim');
    let activeSourceId = '';
    let sourceMenuButton = null;
    let scanTimer = null;

    function statusMarkup(source){
      if(source.status === 'scanning') return '<span class="spinner" aria-hidden="true"></span><span>扫描中…</span>';
      return '<svg aria-hidden="true"><use href="#ph-check-circle"></use></svg><span>可用</span>';
    }

    function renderSources(){
      sourceList.innerHTML = sources.map(source => `
        <article class="source-item" data-source-id="${source.id}" data-od-id="source-item-${source.id}">
          <button class="source-hit" type="button" data-source-detail="${source.id}" data-route="source-detail" aria-label="查看${source.name}详情"></button>
          <span class="source-icon"><svg aria-hidden="true"><use href="#${source.icon}"></use></svg></span>
          <span class="source-copy">
            <strong class="source-name">${source.name}</strong>
            <span class="source-type">${source.type}</span>
            <span class="source-location">${source.location}</span>
          </span>
          <span class="source-status" aria-live="polite">${statusMarkup(source)}</span>
          <span class="source-footer"><span class="source-count">${source.movieCount} 部电影</span><span class="meta-divider" aria-hidden="true">·</span><span class="source-last-scan">上次扫描 · ${source.lastScan}</span></span>
          <button class="source-more" type="button" data-source-more="${source.id}" aria-label="${source.name}更多操作" aria-haspopup="menu" aria-expanded="false"><svg aria-hidden="true"><use href="#ph-dots-three-bold"></use></svg></button>
        </article>
      `).join('');
      sourceList.hidden = sources.length === 0;
      sourceEmpty.hidden = sources.length !== 0;
    }

    function renderScans(){
      const currentIds = new Set(sources.map(source => source.id));
      const visibleScans = scans.filter(scan => currentIds.has(scan.sourceId));
      scanList.innerHTML = visibleScans.map(scan => `
        <article class="scan-item" data-od-id="scan-item-${scan.sourceId}">
          <button class="scan-hit" type="button" data-scan-detail="${scan.id}" data-scan-source="${scan.sourceId}" aria-label="查看${scan.name}扫描详情"></button>
          <span class="scan-icon"><svg aria-hidden="true"><use href="#ph-check-circle"></use></svg></span>
          <span class="scan-copy"><strong>${scan.name}</strong><span>${scan.summary}</span></span>
          <time class="scan-time">${scan.time}</time>
          <svg class="scan-chevron" aria-hidden="true"><use href="#ph-caret-right"></use></svg>
        </article>
      `).join('');
      document.getElementById('recentScansTitle').parentElement.hidden = visibleScans.length === 0;
    }

    function hydrateRecentPosters(){
      try{
        const searchPosterUrls = new Map([...document.querySelectorAll('.search-result')].map(result => {
          const title = result.querySelector('strong')?.textContent.trim();
          const image = result.querySelector('.search-thumb');
          return [title,image?.src];
        }).filter(([title,url]) => title && url));
        const parasiteSeed = document.getElementById('recentPosterParasiteSeed');
        if(parasiteSeed?.src) searchPosterUrls.set('寄生虫',parasiteSeed.src);
        const mediaById = new Map(recentMedia.map(movie => [movie.id,movie]));
        recentMediaGrid.querySelectorAll('[data-poster-key]').forEach(image => {
          const movie = mediaById.get(image.dataset.posterKey);
          const posterUrl = movie && searchPosterUrls.get(movie.posterSourceTitle);
          if(posterUrl) image.src = posterUrl;
        });
      }catch(error){
        console.warn('Failed to hydrate recent posters:',error);
      }
    }

    function renderRecentMedia(){
      recentMediaGrid.innerHTML = recentMedia.map(movie => `
        <a class="recent-media-item" href="${movie.href}" data-od-id="recent-media-${movie.id}" aria-label="查看${movie.title}">
          <span class="recent-poster"><img data-poster-key="${movie.id}" alt="${movie.title}电影海报" /></span>
          <span class="recent-media-copy"><strong class="recent-media-title">${movie.title}</strong><span class="recent-media-source">${movie.sourceName}</span></span>
        </a>
      `).join('');
      hydrateRecentPosters();
    }

    function announce(message){
      announcement.textContent = '';
      requestAnimationFrame(() => announcement.textContent = message);
    }

    function openSourceMenu(button,id){
      closeSourceMenu(false);
      activeSourceId = id;
      sourceMenuButton = button;
      button.setAttribute('aria-expanded','true');
      sourceMenu.dataset.open = 'true';
      sourceMenuScrim.dataset.open = 'true';
      if(window.innerWidth > 900){
        const rect = button.getBoundingClientRect();
        const menuWidth = 176;
        const top = Math.min(rect.bottom + 6,window.innerHeight - sourceMenu.offsetHeight - 12);
        const left = Math.min(rect.right - menuWidth,window.innerWidth - menuWidth - 12);
        sourceMenu.style.top = `${Math.max(12,top)}px`;
        sourceMenu.style.left = `${Math.max(12,left)}px`;
      }
      sourceMenu.querySelector('button').focus();
    }

    function closeSourceMenu(restoreFocus=true){
      sourceMenu.dataset.open = 'false';
      sourceMenuScrim.dataset.open = 'false';
      if(sourceMenuButton){
        sourceMenuButton.setAttribute('aria-expanded','false');
        if(restoreFocus && document.contains(sourceMenuButton)) sourceMenuButton.focus();
      }
      sourceMenuButton = null;
    }

    function scanSource(id){
      const source = sources.find(item => item.id === id);
      if(!source) return;
      source.status = 'scanning';
      renderSources();
      announce(`${source.name}正在扫描`);
      clearTimeout(scanTimer);
      scanTimer = setTimeout(() => {
        window.location.href = `personal-cinema-scan-task.html?autostart=1&source=${encodeURIComponent(id)}`;
      },120);
    }

    sourceList.addEventListener('click',event => {
      const more = event.target.closest('[data-source-more]');
      if(more){openSourceMenu(more,more.dataset.sourceMore);return;}
      const detail = event.target.closest('[data-source-detail]');
      if(detail){
        const source = sources.find(item => item.id === detail.dataset.sourceDetail);
        if(source) announce(`已准备查看${source.name}详情`);
      }
    });

    scanList.addEventListener('click',event => {
      const detail = event.target.closest('[data-scan-detail]');
      if(!detail) return;
      const source = sources.find(item => item.id === detail.dataset.scanSource);
      if(source){
        announce(`正在打开${source.name}的扫描详情`);
        window.location.href = `personal-cinema-scan-task.html?state=complete&source=${encodeURIComponent(source.id)}&task=${encodeURIComponent(detail.dataset.scanDetail)}`;
      }
    });

    sourceMenuScrim.addEventListener('click',() => closeSourceMenu());
    sourceMenu.addEventListener('click',event => {
      const action = event.target.closest('[data-source-action]');
      if(!action) return;
      const id = activeSourceId;
      const source = sources.find(item => item.id === id);
      closeSourceMenu(false);
      if(!source) return;
      if(action.dataset.sourceAction === 'detail') announce(`已准备查看${source.name}详情`);
      if(action.dataset.sourceAction === 'scan') scanSource(id);
      if(action.dataset.sourceAction === 'edit') openSourceDialog(source);
      if(action.dataset.sourceAction === 'remove'){
        const index = sources.findIndex(item => item.id === id);
        if(index > -1) sources.splice(index,1);
        renderSources();renderScans();announce(`已移除${source.name}`);
      }
    });

    const sourceDialogScrim = document.getElementById('sourceDialogScrim');
    const sourceDialog = document.getElementById('sourceDialog');
    const sourceDialogTitle = document.getElementById('sourceDialogTitle');
    const sourceFormPanel = document.getElementById('sourceFormPanel');
    const dialogHeaderSpacer = document.getElementById('dialogHeaderSpacer');
    const webdavFields = document.getElementById('webdavFields');
    const testConnection = document.getElementById('testConnection');
    const saveSource = document.getElementById('saveSource');
    const connectionFeedback = document.getElementById('connectionFeedback');
    let dialogState = 'closed';
    let editingSourceId = '';
    let dialogTrigger = null;
    let connectionTimer = null;

    function openSourceDialog(source=null){
      dialogTrigger = document.activeElement;
      sourceDialogScrim.dataset.open = 'true';
      document.body.setAttribute('data-dialog-open','true');
      editingSourceId = source ? source.id : '';
      showSourceForm(source);
      requestAnimationFrame(() => {
        const target = sourceDialog.querySelector('button:not([hidden]),input:not([hidden])');
        if(target) target.focus();
      });
    }

    function showSourceForm(source=null){
      dialogState = 'form';
      sourceFormPanel.hidden = false;
      dialogHeaderSpacer.hidden = false;
      connectionFeedback.textContent = '';connectionFeedback.dataset.success = 'false';
      sourceDialogTitle.textContent = source ? '编辑 WebDAV 来源' : '添加 WebDAV 来源';
      webdavFields.hidden = false;testConnection.hidden = false;
      document.getElementById('sourceName').value = source?.name || '';
      document.getElementById('sourceAddress').value = source?.address || '';
      document.getElementById('sourceUsername').value = source?.username || '';
      document.getElementById('sourcePassword').value = '';
      document.getElementById('sourcePath').value = source?.rootPath || '/';
      testConnection.textContent = '测试连接';testConnection.disabled = false;
      saveSource.disabled = !source;saveSource.textContent = source ? '保存更改' : '添加来源';
      requestAnimationFrame(() => document.getElementById('sourceName').focus());
    }

    function closeSourceDialog(){
      clearTimeout(connectionTimer);
      sourceDialogScrim.dataset.open = 'false';
      document.body.removeAttribute('data-dialog-open');
      dialogState = 'closed';
      if(dialogTrigger && document.contains(dialogTrigger)) dialogTrigger.focus();
    }

    document.getElementById('addSourceButton').addEventListener('click',() => openSourceDialog());
    document.getElementById('emptyAddSource').addEventListener('click',() => openSourceDialog());
    document.getElementById('dialogClose').addEventListener('click',closeSourceDialog);
    sourceDialogScrim.addEventListener('click',event => {if(event.target === sourceDialogScrim) closeSourceDialog();});

    testConnection.addEventListener('click',() => {
      testConnection.disabled = true;saveSource.disabled = true;testConnection.textContent = '正在连接…';
      connectionFeedback.textContent = '正在连接…';connectionFeedback.dataset.success = 'false';
      clearTimeout(connectionTimer);
      connectionTimer = setTimeout(() => {
        testConnection.disabled = false;testConnection.textContent = '重新测试';saveSource.disabled = false;
        connectionFeedback.textContent = '✓ 连接成功';connectionFeedback.dataset.success = 'true';
      },850);
    });

    sourceFormPanel.addEventListener('submit',event => {
      event.preventDefault();
      const name = document.getElementById('sourceName').value.trim() || '我的 WebDAV';
      const address = document.getElementById('sourceAddress').value.trim();
      const username = document.getElementById('sourceUsername').value.trim();
      const rootPath = document.getElementById('sourcePath').value.trim() || '/';
      const host = address.replace(/^https?:\/\//,'').replace(/\/$/,'') || 'WebDAV';
      const location = `${host} · ${rootPath}`;
      const typeLabel = 'WebDAV';
      const icon = 'ph-cloud';
      const existing = editingSourceId ? sources.find(item => item.id === editingSourceId) : sources.find(item => item.name === name);
      if(existing){Object.assign(existing,{name,address,username,rootPath,location,type:typeLabel,icon});}
      else{
        const id = `source-${Date.now()}`;
        sources.push({id,name,address,username,rootPath,type:typeLabel,location,movieCount:0,status:'available',lastScan:'尚未扫描',icon});
        scans.unshift({id:`scan-${id}`,sourceId:id,name,summary:'等待首次扫描',time:'刚刚'});
      }
      renderSources();renderScans();closeSourceDialog();announce(`${name}已添加`);
    });

    sourceDialog.addEventListener('keydown',event => {
      if(event.key !== 'Tab') return;
      const focusable = [...sourceDialog.querySelectorAll('button:not([hidden]):not(:disabled),input:not([hidden]):not(:disabled)')].filter(item => item.offsetParent !== null);
      if(!focusable.length) return;
      const first = focusable[0],last = focusable[focusable.length-1];
      if(event.shiftKey && document.activeElement === first){event.preventDefault();last.focus();}
      else if(!event.shiftKey && document.activeElement === last){event.preventDefault();first.focus();}
    });

    const accountWrap = document.getElementById('accountWrap');
    const accountButton = document.getElementById('accountButton');
    accountButton.addEventListener('click',event => {
      event.stopPropagation();
      const open = accountWrap.dataset.open !== 'true';accountWrap.dataset.open = String(open);accountButton.setAttribute('aria-expanded',String(open));
    });
    accountWrap.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click',() => {accountWrap.dataset.open='false';accountButton.setAttribute('aria-expanded','false');announce(button.dataset.action === 'profile' ? '已准备打开个人资料' : '退出登录为演示操作');}));
    document.addEventListener('click',event => {if(!accountWrap.contains(event.target)){accountWrap.dataset.open='false';accountButton.setAttribute('aria-expanded','false');}});

    const routeFiles = {home:'personal-cinema-app-shell-v2.html',movies:'personal-cinema-movie-library.html',ai:'personal-cinema-ai-discovery.html'};
    document.querySelectorAll('.sidebar-link[data-route]').forEach(button => button.addEventListener('click',() => {
      const route = button.dataset.route;
      if(routeFiles[route]) window.location.href = routeFiles[route];
      else if(route !== 'sources') announce(`${button.textContent.trim()}页面入口已准备`);
    }));

    const searchButton = document.getElementById('searchButton');
    const searchScrim = document.getElementById('searchScrim');
    const searchDialog = document.getElementById('searchDialog');
    const searchInput = document.getElementById('globalSearch');
    const clearSearch = document.getElementById('clearSearch');
    const searchCaption = document.getElementById('searchCaption');
    const searchResultList = document.getElementById('searchResultList');
    const searchEmpty = document.getElementById('searchEmpty');
    const searchItems = [...searchResultList.querySelectorAll('.search-result')];
    let searchIndex = -1;
    function renderSearch(){
      const query = searchInput.value.trim().toLowerCase();
      let visible = 0;
      clearSearch.hidden = !searchInput.value;
      searchCaption.textContent = query ? '搜索结果' : '最近内容';
      searchItems.forEach((item,index) => {
        const match = query ? item.dataset.search.toLowerCase().includes(query) : index < 5;
        item.hidden = !match;
        if(match) visible += 1;
        item.removeAttribute('data-active');
      });
      searchEmpty.hidden = visible > 0;
      searchIndex = -1;
    }
    function openSearch(){
      closeSourceMenu(false);renderSearch();searchDialog.dataset.open='true';searchScrim.dataset.open='true';searchButton.setAttribute('aria-expanded','true');document.body.dataset.locked='true';setTimeout(()=>searchInput.focus(),0);
    }
    function closeSearch(){searchDialog.dataset.open='false';searchScrim.dataset.open='false';searchButton.setAttribute('aria-expanded','false');document.body.dataset.locked='false';searchIndex=-1;}
    searchButton.addEventListener('click',openSearch);
    searchScrim.addEventListener('click',closeSearch);
    searchInput.addEventListener('input',renderSearch);
    clearSearch.addEventListener('click',()=>{searchInput.value='';renderSearch();searchInput.focus();});
    searchResultList.addEventListener('click',event=>{const item=event.target.closest('.search-result');if(!item)return;if(item.dataset.href)window.location.href=item.dataset.href;else{announce(`已选择${item.querySelector('strong').textContent}`);closeSearch();}});
    searchInput.addEventListener('keydown',event=>{if(!['ArrowDown','ArrowUp','Enter'].includes(event.key))return;const visible=searchItems.filter(item=>!item.hidden);if(!visible.length)return;if(event.key==='Enter'){if(searchIndex>=0){event.preventDefault();visible[searchIndex].click();}return;}event.preventDefault();searchIndex=event.key==='ArrowDown'?(searchIndex+1)%visible.length:searchIndex<=0?visible.length-1:searchIndex-1;searchItems.forEach(item=>item.removeAttribute('data-active'));visible[searchIndex].dataset.active='true';});

    document.addEventListener('keydown',event => {
      if(event.key === 'Escape'){
        if(sourceDialogScrim.dataset.open === 'true') closeSourceDialog();
        else if(searchDialog.dataset.open === 'true') closeSearch();
        else if(sourceMenu.dataset.open === 'true') closeSourceMenu();
        else if(accountWrap.dataset.open === 'true'){accountWrap.dataset.open='false';accountButton.setAttribute('aria-expanded','false');accountButton.focus();}
      }
      if(event.key === '/' && document.activeElement !== searchInput){event.preventDefault();openSearch();}
    });

    renderSources();
    renderScans();
    try{
      renderRecentMedia();
    }catch(error){
      console.warn('Failed to render recent media:',error);
    }
  </script>
</body>
</html>
