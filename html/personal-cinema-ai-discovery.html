  <style>
:root{

*,*::before,*::after{box-sizing:border-box}

[hidden]{display:none!important}

.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}
.icon{width:20px;height:20px;flex:0 0 auto}
button:focus-visible,a:focus-visible,.search-input:focus-visible,.ai-query-input:focus-visible,.ai-followup-input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Shared app shell */
.sidebar{position:fixed;inset:0 auto 0 0;z-index:20;width:var(--sidebar);padding:20px 14px 16px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:20px}

.ai-query-submit:hover{background:var(--fg);transform:translateX(1px)}.ai-query-submit:active{transform:scale(.96)}.ai-query-submit svg{width:17px;height:17px;fill:currentColor}
.ai-examples{margin-top:21px;text-align:center}.ai-kicker{margin-bottom:11px;color:var(--text-tertiary);font-size:12px;font-weight:600;letter-spacing:.02em}

.ai-example:hover{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.065);color:var(--fg)}

.ai-response{width:min(100%,950px);margin:0 auto;padding-bottom:132px}.ai-response[hidden]{display:none}
.ai-conversation-history{display:grid;gap:44px}.ai-conversation-history:empty{display:none}.ai-conversation-history:not(:empty){margin-bottom:46px}.ai-current-turn,.ai-history-turn{min-width:0}.ai-user-turn{display:flex;justify-content:flex-end;margin-bottom:25px}.ai-user-turn p{max-width:62%;padding:10px 13px;border-radius:var(--radius-sm);background:rgba(255,255,255,.055);color:color-mix(in oklch,var(--text-secondary) 60%,var(--fg));font-size:14px;line-height:1.55;overflow-wrap:anywhere}.ai-current-reply,.ai-history-reply{min-width:0}.ai-history-ai-label{display:flex;align-items:center;gap:7px;color:var(--text-tertiary);font-size:12px;font-weight:600}.ai-history-ai-label svg{width:14px;height:14px;color:var(--icon-default);fill:currentColor}.ai-history-answer{display:-webkit-box;max-width:760px;max-height:48px;margin-top:8px;overflow:hidden;color:var(--text-secondary);font-size:13px;line-height:24px;-webkit-box-orient:vertical;-webkit-line-clamp:2}.ai-history-compact{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.ai-history-summary{display:flex;min-width:0;flex-wrap:wrap;gap:8px 14px;color:var(--text-tertiary);font-size:12px}.ai-history-summary strong{color:var(--text-secondary);font-weight:600}.ai-history-titles{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ai-history-toggle{min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--text-tertiary);font-size:12px}.ai-history-toggle:hover{color:var(--fg)}.ai-history-toggle:active{color:var(--fg);transform:translateY(1px)}.ai-history-detail{margin-top:24px}.ai-history-conditions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:24px}.ai-history-conditions>span:first-child{margin-right:3px;color:var(--text-tertiary);font-size:12px}.ai-history-conditions>div{display:flex;flex-wrap:wrap;gap:8px}.ai-history-result-list{width:100%}.ai-action-feed{display:grid;gap:28px;margin-top:36px}.ai-action-feed:empty{display:none}.ai-action-exchange+.ai-action-exchange{margin-top:8px}.ai-action-answer{max-width:760px}.ai-action-answer p:last-child{margin-top:7px;color:var(--text-secondary);font-size:13px;line-height:1.6}
.ai-understood{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--text-tertiary);font-size:12px;font-weight:600}
.ai-understood svg{width:15px;height:15px;fill:currentColor}
.ai-condition{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border:1px solid rgba(255,255,255,.07);border-radius:var(--radius-pill);background:rgba(255,255,255,.035);color:var(--text-secondary);font-size:12px}
.ai-answer{max-width:760px}.ai-answer-label{display:flex;align-items:center;gap:7px;color:var(--text-tertiary);font-size:12px;font-weight:600}.ai-answer-label svg{width:14px;height:14px;color:var(--icon-default);fill:currentColor}.ai-answer-text{margin-top:8px;color:color-mix(in oklch,var(--text-secondary) 72%,var(--fg));font-size:14px;line-height:1.72}.ai-understanding{margin-top:20px}

.ai-spinner{width:16px;height:16px;border:1.5px solid rgba(255,255,255,.16);border-top-color:var(--fg);border-radius:var(--radius-circle);animation:ai-spin .75s linear infinite}

.ai-results{margin-top:30px}.ai-results-heading{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}.ai-results-heading h2{font:650 20px/1.2 var(--font-display);letter-spacing:-.02em}.ai-library-note{color:var(--text-tertiary);font-size:12px}

.ai-result-list{width:100%}
.movie-card{min-width:0;max-width:170px}.poster-art{position:relative;aspect-ratio:2/3;overflow:hidden;border-radius:var(--radius-poster);background:var(--panel);box-shadow:0 8px 22px color-mix(in oklch,var(--bg) 46%,transparent);transition:box-shadow .2s ease-out}
.poster-art>img{width:100%;height:100%;border-radius:inherit;object-fit:cover}.poster-art::after{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity 110ms ease-in}
.movie-card:hover .poster-art::after,.movie-card:has(.play-mark:focus-visible) .poster-art::after,.movie-card:has(.poster-more-mark:focus-visible) .poster-art::after{opacity:1}

.play-mark{left:10px;bottom:12px;border:1px solid rgba(255,255,255,.16);background:rgba(246,246,246,.74);color:#111113;box-shadow:0 5px 16px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.1)}.play-mark svg{width:13px;height:13px;fill:currentColor}

.movie-card:hover .play-mark,.movie-card:hover .poster-more-mark,.play-mark:focus-visible,.poster-more-mark:focus-visible{opacity:1}.movie-card:hover .play-mark,.play-mark:focus-visible{background:rgba(245,245,247,.9)}.movie-card:hover .poster-more-mark,.poster-more-mark:focus-visible{background:rgba(245,245,247,.24)}

.ai-nearby{margin-top:44px}.ai-nearby-heading{font:600 18px/1.25 var(--font-display);letter-spacing:-.02em}.ai-nearby-note{margin-top:6px;color:var(--text-tertiary);font-size:12px;line-height:18px}.ai-nearby-shelf{margin-top:16px;padding-bottom:0}.ai-candidate-gap{overflow:hidden;margin-top:7px;color:var(--text-tertiary);font-size:11px;line-height:16px;text-overflow:ellipsis;white-space:nowrap}

      function resizeQuery() {
        queryInput.style.height = 'auto';
        queryInput.style.height = `${Math.min(queryInput.scrollHeight,72)}px`;
      }

      function resetQueryEditor() {
        queryShell.hidden = false;
        queryForm.dataset.mode = 'initial';
        followupForm.hidden = false;
        conversationTurns = [];
        activeTurn = null;
        conversationHistory.innerHTML = '';
        currentUserMessage.textContent = '';
        actionFeed.innerHTML = '';
        resizeQuery();
      }

      function renderConditions(items) {
        conditionList.innerHTML = items.map(item => `<span class="ai-condition">${escapeHtml(item)}</span>`).join('');
      }

      function escapeHtml(value = '') {
        return String(value).replace(/[&<>"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[character]));
      }

      function clonePreset(preset) {
        return {
          ...preset,
          conditions:[...(preset.conditions || [])],
          results:[...(preset.results || [])],
          nearby:(preset.nearby || []).map(item => [...item]),
          refinements:(preset.refinements || []).map(item => [...item]),
          stages:preset.stages ? [...preset.stages] : undefined
        };
      }

      function renderProgress(stages) {
        progress.innerHTML = stages.map((stage,index) => `${index ? '<span class="ai-progress-separator" aria-hidden="true">›</span>' : ''}<span class="ai-progress-step" data-state="pending"><svg aria-hidden="true"><use href="#ph-check-circle"></use></svg>${stage}</span>`).join('');
      }

      function renderRefinements(items = []) {
        refine.hidden = !items.length;
        refineList.innerHTML = items.map(([label,preset],index) => `<button class="ai-example" type="button" data-preset="${preset}" data-refinement="${escapeHtml(label)}" data-od-id="ai-refine-${preset}-${index}">${escapeHtml(label)}</button>`).join('');
      }

      function renderNearby(items = [],strictCount = 0) {
        const shouldShow = strictCount <= 3 && items.length > 0;
        nearby.hidden = !shouldShow;
        nearbyShelf.innerHTML = shouldShow ? items.map(([key,gap]) => movieCard(movies[key],key,false,gap)).join('') : '';
        if (shouldShow) hydratePosterImages(nearbyShelf);
      }

      function getAssetSrc(path) {
        if (window.location.protocol === 'file:') return path;
        const pathname = window.location.pathname;
        const base = pathname.slice(0,pathname.lastIndexOf('/') + 1);
        return base + path + window.location.search;
      }

      function hydratePosterImages(root) {
        root.querySelectorAll('img[data-poster-key]').forEach(img => {
          const movie = movies[img.dataset.posterKey];
          if (!movie) return;
          img.src = getAssetSrc(movie.poster);
        });
      }

      function movieCard(movie,key,includeAiDetails = true,candidateGap = '',odPrefix = 'ai-result') {
        const attributes = `data-title="${movie.title}" data-status="${movie.status}" data-favorite="false" data-href="${movie.href || ''}"`;
        const artwork = `<div class="poster-art"><img data-poster-key="${key}" alt="${movie.title}电影海报" /><button class="poster-detail-hit" type="button" aria-label="查看${movie.title}详情"></button><button class="play-mark" type="button" aria-label="播放${movie.title}"><svg aria-hidden="true"><use href="#ph-play-fill"></use></svg></button><button class="poster-more-mark" type="button" aria-label="${movie.title}更多操作" aria-haspopup="menu" aria-expanded="false" aria-controls="movieContextMenu"><svg aria-hidden="true"><use href="#ph-dots-three-bold"></use></svg></button></div>`;
        if (!includeAiDetails) return `<article class="movie-card" ${attributes} data-od-id="${candidateGap ? 'ai-nearby' : 'ai-starter'}-${key}">${artwork}<div class="poster-copy"><strong class="poster-title">${movie.title}</strong><span class="poster-meta">${movie.year} · ${movie.genre}</span></div>${candidateGap ? `<p class="ai-candidate-gap">${candidateGap}</p>` : ''}</article>`;
        return `<article class="movie-card ai-result-row" ${attributes} data-od-id="${odPrefix}-${key}">
          <div class="ai-result-poster">${artwork}</div>
          <div class="ai-result-copy">
            <div class="ai-result-heading"><strong>${movie.title}</strong><span>${movie.year} · ${movie.genre} · ${movie.duration} 分钟</span></div>
            <p class="ai-result-facts">${movie.statusLabel} · ${movie.resourceAvailable ? '当前可播放' : '暂不可用'} · ${movie.mediaSourceName}</p>
            <div class="ai-result-reason"><span class="ai-result-reason-label"><svg aria-hidden="true"><use href="#ph-sparkle"></use></svg>推荐理由</span><p>${movie.reason}</p></div>
            <div class="ai-result-actions"><button type="button" data-result-action="play"><svg aria-hidden="true"><use href="#ph-play-fill"></use></svg>播放</button><button type="button" data-result-action="detail">查看详情</button></div>
          </div>
        </article>`;
      }

      function sparkleLabel() {
        return `<span class="ai-history-ai-label"><svg aria-hidden="true"><use href="#ph-sparkle"></use></svg>AI</span>`;
      }

      function archiveActiveTurn() {
        if (!activeTurn?.preset) return;
        conversationTurns.push({
          id:activeTurn.id,
          userMessage:activeTurn.userMessage,
          preset:clonePreset(activeTurn.preset),
          actions:(activeTurn.actions || []).map(action => ({...action}))
        });
        renderConversationHistory();
      }

      function renderConversationHistory() {
        conversationHistory.innerHTML = conversationTurns.map(turn => {
          const preset = turn.preset;
          const titles = preset.results.map(key => movies[key]?.title).filter(Boolean).join(' · ');
          const conditions = preset.conditions.map(item => `<span class="ai-condition">${escapeHtml(item)}</span>`).join('');
          const cards = preset.results.map(key => movieCard(movies[key],key,true,'',`ai-history-${turn.id}`)).join('');
          const actions = turn.actions.map(action => `<div class="ai-action-exchange"><div class="ai-user-turn"><p>${escapeHtml(action.user)}</p></div><div class="ai-action-answer">${sparkleLabel()}<p>${escapeHtml(action.ai)}</p></div></div>`).join('');
          return `<article class="ai-history-turn" data-turn-id="${turn.id}" data-od-id="ai-history-turn-${turn.id}">
            <div class="ai-user-turn"><p>${escapeHtml(turn.userMessage)}</p></div>
            <div class="ai-history-reply">
              ${sparkleLabel()}
              <p class="ai-history-answer">${escapeHtml(preset.answer)}</p>
              <div class="ai-history-compact">
                <p class="ai-history-summary"><strong>找到 ${preset.results.length} 部符合条件的影片。</strong><span class="ai-history-titles">${escapeHtml(titles || '暂无严格匹配')}</span></p>
                <button class="ai-history-toggle" type="button" data-history-toggle aria-expanded="false" aria-controls="ai-history-detail-${turn.id}">展开</button>
              </div>
              <div class="ai-history-detail" id="ai-history-detail-${turn.id}" hidden>
                <div class="ai-history-conditions"><span>理解为</span><div>${conditions}</div></div>
                <div class="ai-history-result-list">${cards}</div>
              </div>
              ${actions}
            </div>
          </article>`;
        }).join('');
        hydratePosterImages(conversationHistory);
      }

      function appendActionExchange(userMessage,aiMessage) {
        if (!activeTurn) return;
        activeTurn.actions = activeTurn.actions || [];
        activeTurn.actions.push({user:userMessage,ai:aiMessage});
        actionFeed.insertAdjacentHTML('beforeend',`<div class="ai-action-exchange"><div class="ai-user-turn"><p>${escapeHtml(userMessage)}</p></div><div class="ai-action-answer">${sparkleLabel()}<p>${escapeHtml(aiMessage)}</p></div></div>`);
      }

      starterShelf.innerHTML = ['interstellar','arrival','dune','oppenheimer','bladerunner'].map(key => movieCard(movies[key],key,false)).join('');
      hydratePosterImages(starterShelf);

      function showResults(preset) {
        loading.hidden = true;
        response.setAttribute('aria-busy','false');
        if (activeTurn) activeTurn.preset = clonePreset(preset);
        progress.hidden = !preset.stages;
        answerText.textContent = preset.answer || '我根据当前条件重新检查了你的片库，并保留了最接近的影片。';
        answer.hidden = false;
        const found = preset.results.length;
        if (!found) {
          results.hidden = true;
          emptyState.hidden = false;
          announcement.textContent = '当前条件下没有找到完全符合的影片';
          return;
        }
        results.hidden = false;
        emptyState.hidden = true;
        resultsTitle.textContent = `AI 精选 · ${found}`;
        resultNote.textContent = preset.note;
        resultNote.hidden = !preset.note;
        resultList.innerHTML = preset.results.map(key => movieCard(movies[key],key)).join('');
        hydratePosterImages(resultList);
        renderNearby(preset.nearby,found);
        renderRefinements(preset.refinements);
        announcement.textContent = `已从你的片库中找到 ${found} 部影片`;
      }

      function withCondition(preset,label) {
        if (!preset.conditions.includes(label)) preset.conditions.push(label);
        return preset;
      }

      function createRefinedPreset(base,label) {
        const preset = clonePreset(base || presets[activePreset] || presets.science);
        const originalResults = [...preset.results];
        preset.stages = undefined;
        preset.note = '';
        if (label === '更短一点') {
          const retainedConditions = preset.conditions.join('和');
          withCondition(preset,'时长更短');
          preset.results = preset.results.filter(key => Number(movies[key]?.duration) <= 120).sort((a,b) => Number(movies[a].duration) - Number(movies[b].duration));
          preset.nearby = [...preset.nearby,...originalResults.filter(key => !preset.results.includes(key)).map(key => [key,'片长超过 120 分钟'])].slice(0,4);
          preset.answer = preset.results.length
            ? `好的，我会保留之前的${retainedConditions}条件，并优先缩短影片时长。《${movies[preset.results[0]].title}》现在最符合，片长为 ${movies[preset.results[0]].duration} 分钟。`
            : '加入“时长更短”后，当前片库里没有完全符合其余条件的影片。你可以放宽一种类型或氛围偏好。';
          preset.query = `${preset.query.replace(/[。！!?]+$/,'')}，再短一点。`;
          return preset;
        }
        if (label === '没看过的') {
          withCondition(preset,'未看');
          preset.results = preset.results.filter(key => movies[key]?.status === 'unwatched');
          preset.answer = preset.results.length
            ? `我保留了当前条件，并进一步排除了已看和观看中的影片。现在更推荐《${movies[preset.results[0]].title}》。`
            : '保留当前条件并加入“未看”后，暂时没有严格符合的影片。你可以放宽一个条件继续查找。';
          preset.query = `${preset.query.replace(/[。！!?]+$/,'')}，只看没看过的。`;
          return preset;
        }
        if (label === '轻松一点') {
          withCondition(preset,'氛围更轻松');
          const lighter = preset.results.filter(key => ['arrival','madmax','exmachina','whiplash'].includes(key));
          preset.results = lighter.length ? lighter : preset.results.slice(0,1);
          preset.answer = preset.results.length
            ? `我保留了原有方向，但降低了压迫感。《${movies[preset.results[0]].title}》是当前更克制、相对轻松的选择。`
            : '当前条件下没有更轻松的严格结果，可以再放宽类型偏好。';
          preset.query = `${preset.query.replace(/[。！!?]+$/,'')}，氛围轻松一点。`;
          return preset;
        }
        if (label === '优先当前可播放资源') {
          withCondition(preset,'当前可播放优先');
          preset.results.sort((a,b) => Number(movies[b]?.resourceAvailable) - Number(movies[a]?.resourceAvailable));
          const firstAvailable = preset.results.find(key => movies[key]?.resourceAvailable);
          preset.answer = firstAvailable
            ? `我保留了当前条件，并把已通过状态检查的资源放在前面。《${movies[firstAvailable].title}》当前可从“${movies[firstAvailable].mediaSourceName}”播放。`
            : '我保留了当前推荐条件，但这些候选的 WebDAV 资源目前都不可用。';
          preset.query = `${preset.query.replace(/[。！!?]+$/,'')}，优先当前可播放资源。`;
          return preset;
        }
        return preset;
      }

      function excludeSciencePreset(base) {
        const preset = clonePreset(base || presets[activePreset] || presets.science);
        withCondition(preset,'排除科幻');
        preset.stages = undefined;
        preset.results = preset.results.filter(key => movies[key]?.genre !== '科幻');
        preset.answer = preset.results.length
          ? `我保留了当前上下文并排除了科幻片。现在更推荐《${movies[preset.results[0]].title}》。`
          : '排除科幻后，当前条件下没有严格符合的影片。你可以放宽时长或氛围要求。';
        preset.query = `${preset.query.replace(/[。！!?]+$/,'')}，不要科幻。`;
        return preset;
      }

      function applyRefinement(label,userMessage = label) {
        const refined = createRefinedPreset(activeContext,label);
        queryInput.value = refined.query;
        runPreset(activePreset,true,refined,userMessage);
      }

      function detectPreset(message) {
        if (/可播放|资源.*播放|检查资源/.test(message)) return 'available';
        if (/悬疑|节奏慢|慢一点/.test(message)) return 'mystery';
        if (/今晚|两小时|2\s*小时|短一点/.test(message)) return 'tonight';
        return 'science';
      }

      function runPreset(key,keepQuery = false,contextOverride = null,turnMessage = '') {
        const preset = clonePreset(contextOverride || presets[key] || presets.science);
        const currentRun = ++runId;
        closeContextMenu();
        activePreset = key in presets ? key : 'science';
        activeContext = preset;
        if (!keepQuery) queryInput.value = preset.query;
        const message = (turnMessage || queryInput.value || preset.query).trim();
        archiveActiveTurn();
        activeTurn = {id:++turnCounter,userMessage:message,preset:null,actions:[]};
        currentUserMessage.textContent = message;
        actionFeed.innerHTML = '';
        resizeQuery();
        discovery.dataset.state = 'active';
        response.hidden = false;
        response.setAttribute('aria-busy','true');
        intro.hidden = true;
        examples.hidden = true;
        starter.hidden = true;
        emptyState.hidden = true;
        failureState.hidden = true;
        answer.hidden = true;
        results.hidden = true;
        progress.hidden = true;
        loading.hidden = false;
        loadingText.textContent = preset.stages ? '正在查询片库并检查资源…' : '正在查找你的片库…';
        renderConditions(preset.conditions);
        if (!preset.stages) {
          setTimeout(() => { if (currentRun === runId) showResults(preset); },450);
          return;
        }
        renderProgress(preset.stages);
        progress.hidden = false;
        let stage = 0;
        const timer = setInterval(() => {
          if (currentRun !== runId) return clearInterval(timer);
          const steps = [...progress.querySelectorAll('.ai-progress-step')];
          steps[stage]?.setAttribute('data-state','done');
          stage += 1;
          if (stage < steps.length) {
            loadingText.textContent = stage >= 3 ? '正在检查候选影片的资源状态…' : '正在查询你的片库…';
            return;
          }
          clearInterval(timer);
          setTimeout(() => { if (currentRun === runId) showResults(preset); },180);
        },220);
      }

      queryInput.addEventListener('input', () => { activePreset = 'science';resizeQuery(); });
      queryInput.addEventListener('keydown', event => {
        if(event.key === 'Enter' && !event.shiftKey){event.preventDefault();queryForm.requestSubmit();}
      });
      queryForm.addEventListener('submit', event => {
        event.preventDefault();
        if (!queryInput.value.trim()) return queryInput.focus();
        activePreset = detectPreset(queryInput.value);
        runPreset(activePreset,true,null,queryInput.value.trim());
      });
      examples.querySelectorAll('.ai-example').forEach(button => button.addEventListener('click', () => runPreset(button.dataset.preset,false,null,presets[button.dataset.preset]?.query)));
      refineList.addEventListener('click', event => {
        const button = event.target.closest('[data-preset]');
        if (!button) return;
        const contextual = ['更短一点','没看过的','轻松一点','优先当前可播放资源'];
        if (contextual.includes(button.dataset.refinement)) applyRefinement(button.dataset.refinement,button.dataset.refinement);
        else runPreset(button.dataset.preset,false,null,button.dataset.refinement || presets[button.dataset.preset]?.query);
      });

      function triggerResultAction(position,action) {
        const cards = [...resultList.querySelectorAll('.movie-card.ai-result-row')];
        const card = cards[position];
        if (!card) {
          announcement.textContent = '当前推荐中没有这部影片';
          return;
        }
        const control = card.querySelector(`[data-result-action="${action}"]`);
        control?.click();
      }

      function explainResult(position,userMessage) {
        const key = activeContext?.results?.[position];
        const movie = movies[key];
        if (!movie) {
          announcement.textContent = '当前推荐中没有这部影片';
          return;
        }
        appendActionExchange(userMessage,`《${movie.title}》${movie.reason}`);
        announcement.textContent = `已补充《${movie.title}》的推荐说明`;
      }

      function handleAgentFollowup(value) {
        const message = value.trim();
        if (!message) return;
        if (/播放\s*第?一部|播放\s*第一/.test(message)) {
          const movie = movies[activeContext?.results?.[0]];
          triggerResultAction(0,'play');
          if (movie) appendActionExchange(message,`正在获取当前 PlaybackLocator，并将通过 mpv:// 调用 Windows 本机 mpv 播放《${movie.title}》。`);
          return;
        }
        if (/第?二部.*详情|详情.*第?二部/.test(message)) {
          const movie = movies[activeContext?.results?.[1]];
          if (movie) appendActionExchange(message,`正在打开《${movie.title}》的详情。`);
          triggerResultAction(1,'detail');
          return;
        }
        if (/第?二部.*(怎么样|如何|推荐理由)/.test(message)) {
          explainResult(1,message);
          return;
        }
        if (/更短|短一点|时长短/.test(message)) {
          applyRefinement('更短一点',message);
          return;
        }
        if (/没看过|未看/.test(message)) {
          applyRefinement('没看过的',message);
          return;
        }
        if (/轻松/.test(message)) {
          applyRefinement('轻松一点',message);
          return;
        }
        if (/优先.*可播放|当前可播放|检查资源/.test(message)) {
          applyRefinement('优先当前可播放资源',message);
          return;
        }
        if (/不要科幻|排除科幻/.test(message)) {
          const refined = excludeSciencePreset(activeContext);
          queryInput.value = refined.query;
          runPreset(activePreset,true,refined,message);
          return;
        }
        appendActionExchange(message,'我会继续保留当前推荐上下文。这个演示支持缩短时长、只看未看、降低压迫感、优先当前可播放资源，以及播放或查看推荐影片。');
        announcement.textContent = '已收到你的追问';
      }

      followupForm.addEventListener('submit', event => {
        event.preventDefault();
        const message = followupInput.value;
        if (!message.trim()) return followupInput.focus();
        followupInput.value = '';
        handleAgentFollowup(message);
      });
      document.querySelector('[data-feedback-action="adjust"]').addEventListener('click', () => { response.hidden = true;intro.hidden = false;examples.hidden = false;starter.hidden = false;discovery.dataset.state = 'initial';resetQueryEditor();queryInput.focus(); });

      const contextMenu = $('movieContextMenu');
      const contextScrim = $('movieContextScrim');
      const favoriteAction = $('favoriteAction');
      const watchedAction = $('watchedAction');
      const mobileContextMedia = window.matchMedia('(max-width: 900px), (hover: none)');

      function closeContextMenu(restoreFocus = false) {
        const trigger = activeMoreButton;
        contextMenu.dataset.open = 'false';
        contextMenu.setAttribute('inert','');
        contextScrim.dataset.open = 'false';
        document.body.dataset.actionSheetOpen = 'false';
        activeMoreButton?.setAttribute('aria-expanded','false');
        activeMoreButton = null;activeMovie = null;
        if (restoreFocus) trigger?.focus();
      }

      function openContextMenu(button,card) {
        closeContextMenu();activeMovie = card;activeMoreButton = button;button.setAttribute('aria-expanded','true');
        favoriteAction.querySelector('span').textContent = card.dataset.favorite === 'true' ? '取消收藏' : '收藏';
        watchedAction.querySelector('span').textContent = card.dataset.status === 'watched' ? '标记为未看' : '标记为已看';
        contextMenu.removeAttribute('inert');contextMenu.dataset.open = 'true';
        if (mobileContextMedia.matches) {
          contextMenu.style.removeProperty('left');contextMenu.style.removeProperty('top');contextScrim.dataset.open = 'true';document.body.dataset.actionSheetOpen = 'true';
          requestAnimationFrame(() => contextMenu.querySelector('.context-action')?.focus());return;
        }
        const rect = button.getBoundingClientRect();const menuRect = contextMenu.getBoundingClientRect();
        const left = Math.min(window.innerWidth-menuRect.width-10,Math.max(10,rect.right-menuRect.width));
        let top = rect.bottom+8;if(top+menuRect.height>window.innerHeight-10) top=rect.top-menuRect.height-8;
        contextMenu.style.left=`${left}px`;contextMenu.style.top=`${Math.max(10,top)}px`;
      }

      function handleMovieCardClick(event) {
        const card = event.target.closest('.movie-card');if(!card) return;
        const resultAction = event.target.closest('[data-result-action]');
        if(resultAction?.dataset.resultAction === 'play') return announcement.textContent=`正在获取当前 PlaybackLocator，并通过 mpv:// 调用 Windows 本机 mpv 播放《${card.dataset.title}》`;
        if(resultAction?.dataset.resultAction === 'detail') { if(card.dataset.href) window.location.href=card.dataset.href;else announcement.textContent=`进入《${card.dataset.title}》详情`;return; }
        if(event.target.closest('.poster-more-mark')) return openContextMenu(event.target.closest('.poster-more-mark'),card);
        if(event.target.closest('.play-mark')) return announcement.textContent=`正在获取当前 PlaybackLocator，并通过 mpv:// 调用 Windows 本机 mpv 播放《${card.dataset.title}》`;
        if(event.target.closest('.poster-detail-hit')) {
          if(card.dataset.href) window.location.href=card.dataset.href;
          else announcement.textContent=`进入《${card.dataset.title}》详情`;
        }
      }
      resultList.addEventListener('click',handleMovieCardClick);
      starterShelf.addEventListener('click',handleMovieCardClick);
      nearbyShelf.addEventListener('click',handleMovieCardClick);
      conversationHistory.addEventListener('click',event => {
        const toggle = event.target.closest('[data-history-toggle]');
        if (!toggle) return handleMovieCardClick(event);
        const selectedTurn = toggle.closest('.ai-history-turn');
        const selectedDetail = selectedTurn?.querySelector('.ai-history-detail');
        const shouldExpand = selectedDetail?.hidden;
        conversationHistory.querySelectorAll('.ai-history-turn').forEach(turn => {
          const detail = turn.querySelector('.ai-history-detail');
          const button = turn.querySelector('[data-history-toggle]');
          if (detail) detail.hidden = true;
          if (button) {
            button.setAttribute('aria-expanded','false');
            button.textContent = '展开';
          }
        });
        if (selectedDetail && shouldExpand) {
          selectedDetail.hidden = false;
          toggle.setAttribute('aria-expanded','true');
          toggle.textContent = '收起';
        }
      });

      contextMenu.addEventListener('click', event => {
        const action=event.target.closest('[data-menu-action]');if(!action||!activeMovie) return;
        const title=activeMovie.dataset.title;
        if(action.dataset.menuAction==='play') announcement.textContent=`正在获取当前 PlaybackLocator，并通过 mpv:// 调用 Windows 本机 mpv 播放《${title}》`;
        else if(action.dataset.menuAction==='detail') { if(activeMovie.dataset.href) window.location.href=activeMovie.dataset.href; else announcement.textContent=`进入《${title}》详情`; }
        else if(action.dataset.menuAction==='favorite') { activeMovie.dataset.favorite=String(activeMovie.dataset.favorite!=='true');announcement.textContent=`${title}${activeMovie.dataset.favorite==='true'?'已加入收藏':'已取消收藏'}`; }
        else if(action.dataset.menuAction==='watched') { activeMovie.dataset.status=activeMovie.dataset.status==='watched'?'unwatched':'watched';announcement.textContent=`${title}${activeMovie.dataset.status==='watched'?'已标记为已看':'已标记为未看'}`; }
        else announcement.textContent=`查看《${title}》的媒体版本`;
        closeContextMenu();
      });
      contextScrim.addEventListener('click', () => closeContextMenu());
      window.addEventListener('resize', () => closeContextMenu());

      const searchButton=$('searchButton');const searchDialog=$('searchDialog');const searchScrim=$('searchScrim');const searchInput=$('globalSearch');const clearSearch=$('clearSearch');const searchCaption=$('searchCaption');const searchResultList=$('searchResultList');const searchEmpty=$('searchEmpty');
      const searchItems=[...searchResultList.querySelectorAll('.search-result')];let searchIndex=-1;
      function renderSearch(){const q=searchInput.value.trim().toLowerCase();let visible=0;clearSearch.hidden=!searchInput.value;searchCaption.textContent=q?'搜索结果':'最近内容';searchItems.forEach((item,index)=>{const match=q?item.dataset.search.toLowerCase().includes(q):index<5;item.hidden=!match;if(match)visible+=1;item.removeAttribute('data-active');});searchEmpty.hidden=visible>0;searchIndex=-1;}
      function openSearch(){closeContextMenu();renderSearch();searchDialog.dataset.open='true';searchScrim.dataset.open='true';searchButton.setAttribute('aria-expanded','true');document.body.dataset.locked='true';setTimeout(()=>searchInput.focus(),0)}
      function closeSearch(){searchDialog.dataset.open='false';searchScrim.dataset.open='false';searchButton.setAttribute('aria-expanded','false');document.body.dataset.locked='false';searchIndex=-1}
      searchButton.addEventListener('click',openSearch);searchScrim.addEventListener('click',closeSearch);searchInput.addEventListener('input',renderSearch);
      clearSearch.addEventListener('click',()=>{searchInput.value='';renderSearch();searchInput.focus()});
      searchResultList.addEventListener('click',event=>{const item=event.target.closest('.search-result');if(!item)return;if(item.dataset.href)window.location.href=item.dataset.href;else{announcement.textContent=`进入《${item.querySelector('strong').textContent}》详情`;closeSearch();}});
      searchInput.addEventListener('keydown',event=>{if(!['ArrowDown','ArrowUp','Enter'].includes(event.key))return;const visible=searchItems.filter(item=>!item.hidden);if(!visible.length)return;if(event.key==='Enter'){if(searchIndex>=0){event.preventDefault();visible[searchIndex].click()}return}event.preventDefault();searchIndex=event.key==='ArrowDown'?(searchIndex+1)%visible.length:searchIndex<=0?visible.length-1:searchIndex-1;searchItems.forEach(item=>item.removeAttribute('data-active'));visible[searchIndex].dataset.active='true';});

      const accountWrap=$('accountWrap');const accountButton=$('accountButton');
      accountButton.addEventListener('click',event=>{event.stopPropagation();const open=accountWrap.dataset.open!=='true';accountWrap.dataset.open=String(open);accountButton.setAttribute('aria-expanded',String(open))});
      const routes={home:'personal-cinema-app-shell-v2.html',movies:'personal-cinema-movie-library.html',ai:'personal-cinema-ai-discovery.html',sources:'personal-cinema-media-sources.html'};
      document.addEventListener('click',event=>{const route=event.target.closest('[data-route]');if(route){const target=routes[route.dataset.route];if(target)window.location.href=target;else announcement.textContent=route.dataset.route==='sources'?'进入媒体来源':'进入电影资料库';}if(!contextMenu.contains(event.target)&&!event.target.closest('.poster-more-mark'))closeContextMenu();if(!accountWrap.contains(event.target)){accountWrap.dataset.open='false';accountButton.setAttribute('aria-expanded','false')}});
      document.addEventListener('keydown',event=>{if(event.key==='/'&&document.activeElement!==searchInput&&document.activeElement!==queryInput){event.preventDefault();openSearch()}if(event.key==='Escape'){closeSearch();closeContextMenu(true);accountWrap.dataset.open='false';accountButton.setAttribute('aria-expanded','false')}});
    })();
  </script>
</body>
</html>
